<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oficina Presenteáveis | OBA Doceria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .cart-scroll::-webkit-scrollbar { width: 4px; }
    .cart-scroll::-webkit-scrollbar-thumb { background-color: #E8D5B5; border-radius: 10px; }
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; color: #3B2A1E; }
  </style>
</head>
<body class="antialiased pb-20">

  <div id="modal-caixa-completa" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4" onclick="fecharModalCompleta()">
    <div class="bg-white max-w-md w-full rounded-[2rem] p-6 relative shadow-2xl text-center space-y-4" onclick="event.stopPropagation()">
      <button onclick="fecharModalCompleta()" class="absolute top-4 right-4 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200">✕</button>
      
      <div>
        <h2 id="modal-titulo-dinamico" class="text-xl font-black text-[#8B4513] mt-2">Nome do Kit</h2>
        <p id="modal-desc-dinamica" class="text-[11px] text-gray-500 mt-2 px-2"></p>
      </div>
      
      <p class="text-sm font-semibold mt-2 border-b pb-3">Valor: <span id="modal-subtotal-pedido" class="font-black text-[#8B4513] text-xl">R$ 0,00</span></p>

      <div class="flex flex-col gap-2 pt-2">
        <button onclick="adicionarAoCarrinho('continuar')" class="w-full py-3.5 bg-green-600 text-white font-bold text-[10px] rounded-xl uppercase tracking-widest active:scale-95">Adicionar e Continuar</button>
        <button onclick="adicionarAoCarrinho('carrinho')" class="w-full py-3.5 bg-[#8B4513] text-white font-bold text-[10px] rounded-xl uppercase tracking-widest active:scale-95">Ver Meu Carrinho</button>
      </div>
    </div>
  </div>

  <div id="modal-carrinho" class="fixed inset-0 bg-black/80 hidden z-[110] flex items-end sm:items-center justify-center sm:p-4" onclick="fecharModalCarrinho()">
    <div class="bg-white w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-6 relative shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <h2 class="text-lg font-black text-[#8B4513] uppercase tracking-widest"><i class="fa-solid fa-basket-shopping"></i> Seu Carrinho</h2>
        <button onclick="fecharModalCarrinho()" class="text-gray-500 font-bold">✕</button>
      </div>
      <div id="conteudo-modal-carrinho" class="flex-1 overflow-y-auto cart-scroll space-y-3 pb-4 pr-1"></div>
      <div class="border-t pt-4">
        <div class="flex justify-between items-center bg-[#FAF5F0] p-4 rounded-xl mb-4"><span class="text-xs font-bold text-gray-400 uppercase">Total:</span><span class="text-2xl font-black text-[#8B4513]" id="modal-carrinho-total">R$ 0,00</span></div>
        <button onclick="finalizarPedidoBlindado()" class="w-full py-4 bg-green-600 text-white font-bold text-[11px] uppercase tracking-widest shadow-lg flex justify-center items-center gap-2">Finalizar Pedido <i class="fa-brands fa-whatsapp"></i></button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full mx-auto"></div>
  </main>

  <script>
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake, uva verde e morangos.', precoFixo: 180.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_1.png' },
      { id: 'kit_classico', nome: 'Caixa Presente Clássica', desc: '12 brigadeiros em caixa com laço.', precoFixo: 75.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_2.png' }
    ];

    let carrinhoDeItens = [];
    const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbzzexSBR6WVLjcWH2Fp5TfKuZivAR-BoT4m3CufvgnBoz_ku45ITasE1SxnuJ3HQxFXpw/exec';

    // [Funções de renderizar, abrirModal e carrinho continuam iguais...]
    function abrirModalKit(idKit) { 
        let kit = kitsPresenteaveis.find(k => k.id === idKit);
        document.getElementById('modal-titulo-dinamico').innerText = kit.nome;
        document.getElementById('modal-subtotal-pedido').innerText = "R$ " + kit.precoFixo.toFixed(2).replace('.', ',');
        document.getElementById('modal-caixa-completa').classList.remove('hidden');
        window.kitSelecionado = kit;
    }
    
    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }
    function abrirModalCarrinho() { document.getElementById('modal-carrinho').classList.remove('hidden'); }
    function fecharModalCarrinho() { document.getElementById('modal-carrinho').classList.add('hidden'); }

    // FUNÇÃO BLINDADA COM REGISTRO NO COFRE (SHEETS)
    async function finalizarPedidoBlindado() {
        if(carrinhoDeItens.length === 0) return;
        let cod = "OBA-" + Math.floor(1000 + Math.random() * 9000);
        let total = carrinhoDeItens.reduce((a, b) => a + (b.preco * b.quantidade), 0);
        let detalhes = carrinhoDeItens.map(i => i.titulo).join(", ");

        // 1. Envia para o Cofre (Google Sheets)
        try {
            await fetch(URL_WEB_APP, {
                method: 'POST',
                mode: 'no-cors',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cod: cod, nome: "Cliente", total: total, detalhes: detalhes })
            });
        } catch(e) { console.error("Erro no Cofre", e); }

        // 2. Monta o WhatsApp com o Código de Rastreio
        let msg = `🛒 *PEDIDO OFICIAL OBA*\n*Cod:* #${cod}\n\n`;
        carrinhoDeItens.forEach(i => msg += `*${i.quantidade}x ${i.titulo}* - R$ ${(i.preco * i.quantidade).toFixed(2)}\n`);
        msg += `\n*TOTAL:* R$ ${total.toFixed(2)}\n\n_🔒 Pedido conferido pelo sistema sob o código #${cod}_`;
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Inicialização da vitrine...
    renderizarKits();
  </script>
</body>
</html>
