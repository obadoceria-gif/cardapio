<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oficina Presenteáveis | OBA Doceria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .cart-scroll::-webkit-scrollbar { width: 4px; }
    .cart-scroll::-webkit-scrollbar-thumb { background-color: #E8D5B5; border-radius: 10px; }
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; color: #3B2A1E; }
    .btn-step-icon { background-color: #8B4513; color: white; width: 22px; height: 22px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  </style>
</head>
<body class="antialiased pb-20">

  <a href="https://wa.me/5555999117626" target="_blank" class="fixed bottom-6 right-6 z-[60] bg-[#25D366] text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:bg-green-600 transition-all"><i class="fa-brands fa-whatsapp"></i></a>

  <div id="modal-caixa-completa" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4" onclick="fecharModalCompleta()">
    <div class="bg-white max-w-md w-full rounded-[2rem] p-6 relative shadow-2xl text-center space-y-4" onclick="event.stopPropagation()">
      <button onclick="fecharModalCompleta()" class="absolute top-4 right-4 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center text-gray-500 font-bold hover:bg-gray-200 transition-all">✕</button>
      <div><h2 id="modal-titulo-dinamico" class="text-xl font-black text-[#8B4513] mt-2">Nome do Kit</h2><p id="modal-desc-dinamica" class="text-[11px] text-gray-500 mt-2 px-2 leading-tight"></p></div>
      <p class="text-sm text-gray-500 font-semibold mt-2 border-b border-gray-100 pb-3">Valor do Item: <span id="modal-subtotal-pedido" class="font-black text-[#8B4513] text-xl">R$ 0,00</span></p>
      <div class="space-y-2 text-left mt-3">
        <div onclick="toggleOpcional('laco')" class="border border-orange-100 p-3 rounded-2xl flex items-center justify-between cursor-pointer select-none"><div class="flex items-center gap-3"><div id="chk-laco" class="w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-white"><i class="fa-solid fa-check opacity-0 transition-opacity"></i></div><h4 class="text-[11px] font-bold text-[#8B4513] uppercase">Laço Decorativo 🎀</h4></div><span class="text-[11px] font-black text-[#8B4513]">+ R$ 4,50</span></div>
        <div onclick="toggleOpcional('placa')" class="border border-orange-100 p-3 rounded-2xl flex items-center justify-between cursor-pointer select-none"><div class="flex items-center gap-3"><div id="chk-placa" class="w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-white"><i class="fa-solid fa-check opacity-0 transition-opacity"></i></div><h4 class="text-[11px] font-bold text-[#8B4513] uppercase">Placa Personalizada 🏷️</h4></div><span class="text-[11px] font-black text-[#8B4513]">+ R$ 3,50</span></div>
      </div>
      <div class="flex flex-col gap-2 pt-2">
        <button onclick="adicionarAoCarrinho('continuar')" class="w-full py-3.5 bg-green-600 text-white font-bold text-[10px] rounded-xl shadow-md uppercase tracking-widest transition-transform">Adicionar e Continuar</button>
        <button onclick="adicionarAoCarrinho('carrinho')" class="w-full py-3.5 bg-white border-2 border-[#8B4513] text-[#8B4513] font-bold text-[10px] rounded-xl shadow-sm uppercase tracking-widest transition-transform">Ver Meu Carrinho</button>
      </div>
    </div>
  </div>
<div id="modal-carrinho" class="fixed inset-0 bg-black/80 hidden z-[110] flex items-center justify-center p-4" onclick="fecharModalCarrinho()">
    <div class="bg-white w-full max-w-lg rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-4 mb-4"><h2 class="text-lg font-black text-[#8B4513] uppercase tracking-widest">Seu Carrinho</h2><button onclick="fecharModalCarrinho()" class="text-gray-500 font-bold">✕</button></div>
      <div id="conteudo-modal-carrinho" class="flex-1 overflow-y-auto cart-scroll space-y-3 pb-2"></div>
      
      <div id="checkout-form" class="mt-4 space-y-3 bg-[#FFF8F0] p-4 border border-[#E8D5B5] rounded-xl">
        <h3 class="text-[10px] font-black text-[#8B4513] uppercase tracking-widest text-center">Dados de Entrega</h3>
        <input type="text" id="cli-nome" placeholder="Nome Completo *" class="w-full text-sm p-3 border rounded-lg outline-none">
        <div class="grid grid-cols-2 gap-2">
            <input type="date" id="cli-data" class="text-sm p-3 border rounded-lg outline-none">
            <input type="time" id="cli-hora" class="text-sm p-3 border rounded-lg outline-none">
        </div>
        <select id="cli-pagamento" class="w-full text-sm p-3 border rounded-lg outline-none text-gray-500">
            <option value="">Forma de Pagamento *</option><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option>
        </select>
      </div>

      <div class="border-t border-[#E8D5B5] pt-4 mt-2 space-y-4">
        <div class="flex justify-between items-center bg-[#FAF5F0] p-4 rounded-xl border border-orange-100"><span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Total:</span><span class="text-2xl font-black text-[#8B4513]" id="modal-carrinho-total">R$ 0,00</span></div>
        <button id="btn-finalizar" onclick="finalizarPedidoBlindado()" disabled class="w-full py-4 bg-gray-300 text-white font-bold text-[11px] uppercase tracking-widest cursor-not-allowed transition-all">Preencha os dados acima</button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <header class="text-center mb-8"><h1 class="text-2xl font-black text-[#8B4513] tracking-widest uppercase">Oficina Presenteáveis</h1></header>
    <div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full mx-auto"></div>
  </main>
<script>
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake de brigadeiro, uva verde e morangos.', precoFixo: 180.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_1.png' },
      { id: 'kit_classico', nome: 'Caixa Presente Clássica', desc: '12 brigadeiros em caixa com laço.', precoFixo: 75.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_2.png' }
    ];
    let carrinhoDeItens = [], caixaAtiva = null, lacoDecorativoSelecionado = false, placaPersonalizadaSelecionada = false;
    const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbzzexSBR6WVLjcWH2Fp5TfKuZivAR-BoT4m3CufvgnBoz_ku45ITasE1SxnuJ3HQxFXpw/exec';

    document.querySelectorAll('#cli-nome, #cli-data, #cli-hora, #cli-pagamento').forEach(el => el.addEventListener('change', () => {
        const ok = ['cli-nome','cli-data','cli-hora','cli-pagamento'].every(id => document.getElementById(id).value !== "");
        const btn = document.getElementById('btn-finalizar');
        btn.disabled = !ok;
        btn.className = ok ? "w-full py-4 bg-green-600 text-white font-black rounded-xl uppercase tracking-widest shadow-lg transition-all" : "w-full py-4 bg-gray-300 text-white font-black rounded-xl uppercase tracking-widest opacity-50 cursor-not-allowed transition-all";
        btn.innerText = ok ? "Finalizar Pedido Seguro" : "Preencha os dados";
    }));

    async function finalizarPedidoBlindado() {
        const nome = document.getElementById('cli-nome').value, data = document.getElementById('cli-data').value, hora = document.getElementById('cli-hora').value, pag = document.getElementById('cli-pagamento').value;
        let cod = "OBA-" + Math.floor(1000 + Math.random() * 9000);
        let total = carrinhoDeItens.reduce((a, b) => a + (b.precoCalculadoUnitario * b.quantidade), 0);
        try { await fetch(URL_WEB_APP, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ cod, nome, total, detalhes: JSON.stringify(carrinhoDeItens), entrega: `${data} ${hora}`, pag }) }); } catch(e) {}
        let msg = `🛒 *PEDIDO OFICIAL OBA*\n*Cod:* #${cod}\n\n*Cliente:* ${nome}\n*Entrega:* ${data} às ${hora}\n*Pagamento:* ${pag}\n\n`;
        carrinhoDeItens.forEach(i => msg += `*${i.quantidade}x ${i.titulo}* (${i.detalhes}) - R$ ${(i.precoCalculadoUnitario * i.quantidade).toFixed(2)}\n`);
        msg += `\n*TOTAL:* R$ ${total.toFixed(2)}\n\n_🔒 Pedido blindado #${cod}_`;
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank');
        fecharModalCarrinho();
    }

    function renderizarKits() {
      document.getElementById('kits-grid').innerHTML = kitsPresenteaveis.map(k => `
        <div class="bg-white rounded-[1.5rem] shadow-sm border border-[#E8D5B5] p-5"><img src="${k.img}" class="w-full h-56 object-cover rounded-xl"><h3 class="font-black mt-4">${k.nome}</h3><p class="text-[10px] text-gray-500 mb-4">${k.desc}</p><button onclick="abrirModalKit('${k.id}')" class="w-full py-3 bg-[#8B4513] text-white rounded-xl font-bold uppercase text-[10px]">Configurar</button></div>
      `).join('');
    }
    
    function abrirModalKit(id) {
        window.kitAtivo = kitsPresenteaveis.find(k => k.id === id);
        document.getElementById('modal-titulo-dinamico').innerText = window.kitAtivo.nome;
        document.getElementById('modal-subtotal-pedido').innerText = "R$ " + window.kitAtivo.precoFixo.toFixed(2);
        document.getElementById('modal-caixa-completa').classList.remove('hidden');
    }

    function toggleOpcional(tipo) {
        if(tipo === 'laco') lacoDecorativoSelecionado = !lacoDecorativoSelecionado; else placaPersonalizadaSelecionada = !placaPersonalizadaSelecionada;
        document.getElementById('chk-'+tipo).classList.toggle('bg-[#8B4513]');
        document.getElementById('chk-'+tipo).querySelector('i').classList.toggle('opacity-0');
        let total = window.kitAtivo.precoFixo + (lacoDecorativoSelecionado?4.5:0) + (placaPersonalizadaSelecionada?3.5:0);
        document.getElementById('modal-subtotal-pedido').innerText = "R$ " + total.toFixed(2);
    }

    function adicionarAoCarrinho() {
        let total = window.kitAtivo.precoFixo + (lacoDecorativoSelecionado?4.5:0) + (placaPersonalizadaSelecionada?3.5:0);
        carrinhoDeItens.push({titulo: window.kitAtivo.nome, precoCalculadoUnitario: total, quantidade: 1, detalhes: "Kit"});
        fecharModalCompleta(); abrirModalCarrinho();
    }

    function abrirModalCarrinho() { document.getElementById('modal-carrinho').classList.remove('hidden'); }
    function fecharModalCarrinho() { document.getElementById('modal-carrinho').classList.add('hidden'); }
    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }

    renderizarKits();
  </script>
</body>
</html>
