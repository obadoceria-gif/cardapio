    let caixaAtiva = null; let quantidades = {}; let categoryActive = "Todos"; let lacoDecorativoSelecionado = false; let placaPersonalizadaSelecionada = false;
    let modoDegustacaoAtivo = false; let multiplicadorCaixasDegustacao = 1;
    
    // Lista global para empilhar as caixas montadas prontas
    let carrinhoDeCaixasConcluidas = [];

    window.onload = function() {
      renderizarAbasCategorias();
      renderizarDoces();
      actualizarEstadoBotao();
    };

    function encontrarDoce(id) {
      for (let g of catalogo) {
        for (let i of g.itens) { if (i.id === id) return i; }
      }
      return null;
    }

    function renderizarAbasCategorias() {
      const container = document.getElementById('abas-categorias'); if (!container) return;
      let html = `<button onclick="filtrarCategoria('Todos')" id="aba-Todos" class="px-4 py-1.5 rounded-full font-bold text-xs bg-[#8B4513] text-white shadow-sm transition-all">Todos</button>`;
      catalogo.forEach(g => {
        html += `<button onclick="filtrarCategoria('${g.categoria}')" id="aba-${g.idFiltro}" class="px-4 py-1.5 rounded-full font-bold text-xs bg-white text-[#8B4513] border border-[#E8D5B5] transition-all">${g.categoria.split(" (")[0]}</button>`;
      });
      container.innerHTML = html;
    }

    function filtrarCategoria(cat) {
      categoryActive = cat;
      document.querySelectorAll('#abas-categorias button').forEach(aba => {
        aba.className = "px-4 py-1.5 rounded-full font-bold text-xs bg-white text-[#8B4513] border border-[#E8D5B5] transition-all";
      });
      let idAlvo = "Todos";
      if (cat !== "Todos") {
        const achado = catalogo.find(g => g.categoria === cat);
        if (achado) idAlvo = achado.idFiltro;
      }
      const ativa = document.getElementById(`aba-${idAlvo}`);
      if (ativa) ativa.className = "px-4 py-1.5 rounded-full font-bold text-xs bg-[#8B4513] text-white shadow-sm transition-all";
      renderizarDoces();
    }

    function renderizarDoces() {
      const grid = document.getElementById('cardapio-grid'); if (!grid) return; grid.innerHTML = "";
      catalogo.forEach(g => {
        if (categoryActive !== "Todos" && categoryActive !== g.categoria) return;
        g.itens.forEach(item => {
          const qtd = quantidades[item.id] || 0;
          grid.innerHTML += `
            <div class="bg-white rounded-3xl shadow-sm border border-[#E8D5B5] flex flex-col items-center text-center overflow-hidden w-full">
              <div class="w-full aspect-square bg-gray-50">
                <img src="${item.img}" alt="${item.nome}" class="h-full w-full object-cover" onerror="this.src='https://placehold.co/300x300?text=Oba+Doce'">
              </div>
              <div class="p-3 w-full flex flex-col justify-between flex-1">
                <div>
                  <h3 class="font-bold text-xs mb-0.5 text-[#3B2A1E] line-clamp-1">${item.nome}</h3>
                  <button onclick="openModal('${item.img}', '${item.nome}', 'R$ ${item.preco.toFixed(2).replace('.', ',')}', '${item.id}')" class="text-[10px] text-[#8B4513] underline mb-2 inline-block">Ver detalhes</button>
                </div>
                <div>
                  <p class="text-[10px] text-gray-400 font-bold mb-1.5">R$ ${item.preco.toFixed(2).replace('.', ',')} / un</p>
                  ${caixaAtiva && !caixaAtiva.precoFixo ? `
                    <div class="flex items-center justify-between bg-[#FFF8F0] border border-[#E8D5B5] rounded-xl p-1 w-full">
                      <button onclick="alterarQtd('${item.id}', -1)" class="w-7 h-7 rounded-lg font-black bg-white text-[#8B4513] shadow-sm text-sm flex items-center justify-center">-</button>
                      <input type="number" value="${qtd}" min="0" oninput="digitarQtd('${item.id}', this.value)" class="w-8 text-center font-bold text-xs bg-transparent outline-none text-[#3B2A1E]">
                      <button onclick="alterarQtd('${item.id}', 1)" class="w-7 h-7 rounded-lg font-black bg-[#8B4513] text-white shadow-sm text-sm flex items-center justify-center">+</button>
                    </div>` : `<button onclick="lembreteCaixa()" class="w-full py-1.5 bg-gray-50 text-gray-400 rounded-xl text-[10px] font-extrabold uppercase">Escolha a caixa</button>`}
                </div>
              </div>
            </div>`;
        });
      });
    }

    function abrirBannerDegustacao() {
      modoDegustacaoAtivo = true;
      multiplicadorCaixasDegustacao = 1;
      document.getElementById('input-qtd-caixas-degustacao').value = 1;
      
      caixaAtiva = { id: 'degustacao', titulo: 'Caixa Degustação (Sortida)', totalDoces: 25, precoFixo: 75.00, proximoId: null };
      quantidades = {};
      
      document.getElementById('modal-titulo-dinamico').innerText = "Configurar Sua Caixa Degustação! 🌟";
      document.getElementById('modal-instrucao-opcionais').innerText = "Adicione mimos para presente caso queira:";
      document.getElementById('wrapper-tamanhos-degustacao').classList.remove('hidden');
      document.getElementById('btn-upgrade-caixa').classList.add('hidden');
      document.getElementById('btn-seguir-comprando').classList.remove('hidden');
      document.getElementById('btn-revisar-sabores').classList.add('hidden');
      
      definirTamanhoDegustacao(25, 75);
      document.getElementById('modal-caixa-completa').classList.remove('hidden');
    }

    function definirTamanhoDegustacao(unidades, valorFixo) {
      if(!modoDegustacaoAtivo) return;
      caixaAtiva.totalDoces = unidades;
      caixaAtiva.precoFixo = valorFixo;
      
      ['12', '25', '35'].forEach(u => {
        const btn = document.getElementById(`btn-deg-${u}`);
        if(btn) {
          btn.className = (parseInt(u) === unidades) 
            ? "py-2.5 rounded-xl border-2 border-[#8B4513] font-black text-xs text-white bg-[#8B4513] transition-all shadow-sm" 
            : "py-2.5 rounded-xl border-2 border-orange-200 font-black text-xs text-[#8B4513] bg-white transition-all";
        }
      });
      atualizarInterface();
    }

    function alterarMultiplicadorDegustacao(delta) {
      let novaQtd = multiplicadorCaixasDegustacao + delta;
      if (novaQtd < 1) novaQtd = 1;
      multiplicadorCaixasDegustacao = novaQtd;
      document.getElementById('input-qtd-caixas-degustacao').value = novaQtd;
      atualizarInterface();
    }

    function atualizarMultiplicadorDegustacaoManual(val) {
      let parseado = parseInt(val) || 1;
      if (parseado < 1) parseado = 1;
      multiplicadorCaixasDegustacao = parseado;
      atualizarInterface();
    }

    // NOVA FUNÇÃO: SALVA A ATUAL E LIMPA O PROGRAMA PARA COMPRAR OUTRA
    function adicionarCaixaAoCarrinhoEIniciarNova() {
      if(!caixaAtiva) return;
      
      let basePreco = caixaAtiva.precoFixo ? (caixaAtiva.precoFixo * multiplicadorCaixasDegustacao) : Object.entries(quantidades).reduce((acc, [id, q]) => acc + (encontrarDoce(id).preco * q), 0);
      
      let resumoDaCaixaAtual = {
        titulo: caixaAtiva.titulo,
        precoCalculado: basePreco,
        detalhes: ""
      };

      if(caixaAtiva.precoFixo) {
        resumoDaCaixaAtual.detalhes = `${multiplicadorCaixasDegustacao}x Combo Degustação Sortido (${caixaAtiva.totalDoces} un.)`;
      } else {
        let arraySabores = [];
        Object.entries(quantidades).forEach(([id, q]) => {
          if (q > 0) arraySabores.push(`${q}x ${encontrarDoce(id).nome}`);
        });
        resumoDaCaixaAtual.detalhes = arraySabores.join(', ');
      }

      // Adiciona ao carrinho global acumulado
      carrinhoDeCaixasConcluidas.push(resumoDaCaixaAtual);
      
      // Limpa os estados para a próxima caixa
      caixaAtiva = null;
      quantidades = {};
      modoDegustacaoAtivo = false;
      lacoDecorativoSelecionado = false;
      placaPersonalizadaSelecionada = false;
      
      // Restaura o visual dos botões no Passo 1
      Object.keys(caixasConfigs).forEach(bId => {
        const btn = document.getElementById(`btn-caixa-${bId}`);
        if (btn) btn.className = "bg-white p-5 rounded-2xl border-2 border-[#E8D5B5] text-left flex flex-col justify-between shadow-sm cursor-pointer w-full transition-all";
      });

      renderizarDoces();
      atualizarPainelCarrinhoLateral();
      fecharModalCompleta();
      mostrarNotificacao("Caixa salva com sucesso! Escolha o tamanho da sua próxima caixa no Passo 1.");
    }

    function atualizarPainelCarrinhoLateral() {
      const boxCarrinho = document.getElementById('wrapper-carrinho-multiplas-caixas');
      const containerLista = document.getElementById('lista-carrinho-caixas');
      
      if(carrinhoDeCaixasConcluidas.length === 0) {
        boxCarrinho.classList.add('hidden');
        return;
      }
      
      boxCarrinho.classList.remove('hidden');
      containerLista.innerHTML = "";
      
      carrinhoDeCaixasConcluidas.forEach((cx, index) => {
        containerLista.innerHTML += `
          <div class="bg-gray-50 border border-gray-200 p-2 rounded-xl relative text-left">
            <button onclick="removerCaixaDoCarrinho(${index})" class="absolute top-1 right-2 text-red-500 font-bold hover:text-red-700">✕</button>
            <p class="font-extrabold text-[#8B4513] pr-4">${cx.titulo}</p>
            <p class="text-[10px] text-gray-500 line-clamp-2 mt-0.5">${cx.detalhes}</p>
            <p class="text-[11px] font-black text-gray-700 mt-1">R$ ${cx.precoCalculado.toFixed(2).replace('.', ',')}</p>
          </div>`;
      });
      atualizarInterface();
    }

    function removerCaixaDoCarrinho(index) {
      carrinhoDeCaixasConcluidas.splice(index, 1);
      atualizarPainelCarrinhoLateral();
    }

    function selecionarCaixa(id) {
      modoDegustacaoAtivo = false;
      document.getElementById('wrapper-tamanhos-degustacao').classList.add('hidden');
      document.getElementById('btn-upgrade-caixa').classList.remove('hidden');
      document.getElementById('btn-seguir-comprando').classList.add('hidden');
      document.getElementById('btn-revisar-sabores').classList.remove('hidden');
      document.getElementById('modal-titulo-dinamico').innerText = "Sua Caixa Está Completa! 🎉";
      document.getElementById('modal-instrucao-opcionais').innerText = "Deseja estender sua experiência adicionando mais sabores ou fechar a sua encomenda agora?";
      
      caixaAtiva = caixasConfigs[id]; quantidades = {}; lacoDecorativoSelecionado = false; placaPersonalizadaSelecionada = false;
      
      ['chk-laco', 'chk-placa'].forEach(cid => {
        const el = document.getElementById(cid);
        if(el) { el.className = "w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-white"; el.querySelector('i').classList.add('opacity-0'); }
      });

      Object.keys(caixasConfigs).forEach(bId => {
        const btn = document.getElementById(`btn-caixa-${bId}`);
        if (btn) btn.className = (bId === id) ? "bg-[#FFF8F0] p-5 rounded-2xl border-2 border-[#8B4513] text-left shadow-md flex flex-col justify-between cursor-pointer w-full transition-all" : "bg-white p-5 rounded-2xl border-2 border-[#E8D5B5] text-left flex flex-col justify-between shadow-sm cursor-pointer w-full hover:border-[#8B4513] transition-all";
      });
      renderizarDoces(); atualizarInterface(); fecharModalCompleta();
    }

    function toggleOpcional(tipo) {
      if(tipo === 'laco') {
        lacoDecorativoSelecionado = !lacoDecorativoSelecionado;
        const box = document.getElementById('chk-laco');
        box.className = lacoDecorativoSelecionado ? "w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-[#8B4513]" : "w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-white";
        box.querySelector('i').classList.toggle('opacity-0', !lacoDecorativoSelecionado);
      } else if(tipo === 'placa') {
        placaPersonalizadaSelecionada = !placaPersonalizadaSelecionada;
        const box = document.getElementById('chk-placa');
        box.className = placaPersonalizadaSelecionada ? "w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-[#8B4513]" : "w-5 h-5 rounded border-2 border-[#8B4513] flex items-center justify-center text-white text-xs bg-white";
        box.querySelector('i').classList.toggle('opacity-0', !placaPersonalizadaSelecionada);
      }
      atualizarInterface();
    }

    function calcularValorTotalDoPedido() {
      let subtotal = 0;
      // Soma todas as caixas já salvas no histórico
      carrinhoDeCaixasConcluidas.forEach(cx => subtotal += cx.precoCalculado);
      
      // Soma a caixa que está aberta no momento se houver
      if (caixaAtiva) {
        if (caixaAtiva.precoFixo) { 
          subtotal += caixaAtiva.precoFixo * multiplicadorCaixasDegustacao; 
        } else {
          Object.entries(quantidades).forEach(([id, q]) => {
            const item = encontrarDoce(id); if (item) subtotal += item.preco * q;
          });
        }
        if (lacoDecorativoSelecionado) subtotal += 4.50;
        if (placaPersonalizadaSelecionada) subtotal += 3.50;
      }
      return subtotal;
    }

    function verificarCaixaCompleta() {
      if (!caixaAtiva || modoDegustacaoAtivo) return;
      const total = Object.values(quantidades).reduce((a, b) => a + b, 0);
      if (total === caixaAtiva.totalDoces) {
        atualizarInterface();
        document.getElementById('modal-caixa-completa').classList.remove('hidden');
      }
    }

    function aplicarUpgradeCaixa() {
      if(!caixaAtiva || !caixaAtiva.proximoId) {
        mostrarNotificacao("Você já está no tamanho máximo de caixa!");
        fecharModalCompleta();
        return;
      }
      const antigoTamanho = caixaAtiva.totalDoces;
      const novoId = caixaAtiva.proximoId;
      caixaAtiva = caixasConfigs[novoId];
      
      Object.keys(caixasConfigs).forEach(bId => {
        const btn = document.getElementById(`btn-caixa-${bId}`);
        if (btn) btn.className = (bId === novoId) ? "bg-[#FFF8F0] p-5 rounded-2xl border-2 border-[#8B4513] text-left shadow-md flex flex-col justify-between cursor-pointer w-full transition-all" : "bg-white p-5 rounded-2xl border-2 border-[#E8D5B5] text-left flex flex-col justify-between shadow-sm cursor-pointer w-full hover:border-[#8B4513] transition-all";
      });
      
      renderizarDoces();
      atualizarInterface();
      fecharModalCompleta();
      mostrarNotificacao(`Sua caixa foi expandida para ${caixaAtiva.totalDoces} doces! Adicione mais sabores.`);
    }

    function alterarQtd(id, delta) {
      if (!caixaAtiva || modoDegustacaoAtivo) return;
      const qtdAtual = quantidades[id] || 0; const novaQtd = qtdAtual + delta; if (novaQtd < 0) return;
      const totalGeral = Object.values(quantidades).reduce((a, b) => a + b, 0);
      if (delta > 0 && totalGeral >= caixaAtiva.totalDoces) { mostrarNotificacao("Sua caixa já está cheia!"); return; }
      if (novaQtd === 0) delete quantidades[id]; else quantidades[id] = novaQtd;
      renderizarDoces(); atualizarInterface(); verificarCaixaCompleta();
    }

    function digitarQtd(id, valor) {
      if (!caixaAtiva || modoDegustacaoAtivo) return;
      let qtdDigitada = parseInt(valor) || 0; if (qtdDigitada < 0) qtdDigitada = 0;
      const totalOutros = Object.values(quantidades).reduce((a, b) => a + b, 0) - (quantidades[id] || 0);
      const espacoLivre = caixaAtiva.totalDoces - totalOutros;
      if (qtdDigitada > espacoLivre) { mostrarNotificacao("Limite atingido!"); qtdDigitada = espacoLivre; }
      if (qtdDigitada === 0) delete quantidades[id]; else quantidades[id] = qtdDigitada;
      atualizarInterface(); verificarCaixaCompleta();
    }

    function sincronizarCampos(campo, valor) {
      if (campo === 'nome') { document.getElementById('nome-cliente').value = valor; document.getElementById('modal-nome-cliente').value = valor; } 
      else if (campo === 'data') { document.getElementById('data-desejada').value = valor; document.getElementById('modal-data-desejada').value = valor; } 
      else if (campo === 'hora') { document.getElementById('hora-desejada').value = valor; document.getElementById('modal-hora-desejada').value = valor; }
      actualizarEstadoBotao();
    }

    function atualizarInterface() {
      const container = document.getElementById('lista-selecionados'); if (!container) return;
      container.innerHTML = "";
      
      // Se houver caixas salvas ou ativa, exibe o progresso
      if(caixaAtiva) {
        const total = Object.values(quantidades).reduce((a, b) => a + b, 0);
        document.getElementById('label-progresso-caixa').innerText = "Progresso da Caixa Atual:";
        if (caixaAtiva.precoFixo) {
          document.getElementById('contagem-doces').innerText = `${caixaAtiva.totalDoces * multiplicadorCaixasDegustacao}`;
          document.getElementById('total-doces').innerText = `${caixaAtiva.totalDoces * multiplicadorCaixasDegustacao}`;
          container.innerHTML = `<div class="flex justify-between text-gray-700 py-0.5"><span>Caixa Degustação (${caixaAtiva.totalDoces} un.)</span><span class="font-bold">x${multiplicadorCaixasDegustacao}</span></div>`; 
        } else {
          document.getElementById('contagem-doces').innerText = `${total}`;
          document.getElementById('total-doces').innerText = `${caixaAtiva.totalDoces}`;
          Object.entries(quantidades).forEach(([id, q]) => {
            const doce = encontrarDoce(id); 
            if (doce && q > 0) { container.innerHTML += `<div class="flex justify-between text-gray-700 py-0.5"><span>${doce.nome}</span><span class="font-bold">x${q}</span></div>`; }
          });
          if (total === 0) container.innerHTML = `<p class="text-gray-400 text-center py-2 italic">Nenhum sabor selecionado nesta caixa.</p>`;
        }
      } else {
        document.getElementById('label-progresso-caixa').innerText = "Nenhuma Caixa Aberta";
        document.getElementById('contagem-doces').innerText = "0";
        document.getElementById('total-doces').innerText = "0";
        if (carrinhoDeCaixasConcluidas.length === 0) {
          container.innerHTML = `<p class="text-gray-400 text-center py-2 italic">Ainda não escolheu nenhum sabor.</p>`;
        } else {
          container.innerHTML = `<p class="text-green-700 font-bold text-center py-2"><i class="fa-solid fa-circle-check"></i> Suas caixas estão salvas no carrinho acima!</p>`;
        }
      }

      if (lacoDecorativoSelecionado) container.innerHTML += `<div class="flex justify-between text-orange-700 font-bold border-t border-dashed border-gray-200 pt-1 mt-1"><span>🎀 Laço Decorativo</span><span>+ R$ 4,50</span></div>`;
      if (placaPersonalizadaSelecionada) container.innerHTML += `<div class="flex justify-between text-amber-700 font-bold border-t border-dashed border-gray-200 pt-1 mt-1"><span>🏷️ Placa Personalizada</span><span>+ R$ 3,50</span></div>`;
      
      const totalGeral = calcularValorTotalDoPedido();
      const txtTotal = "R$ " + totalGeral.toFixed(2).replace('.', ',');
      
      document.getElementById('valor-total').innerText = txtTotal;
      document.getElementById('modal-subtotal-pedido').innerText = txtTotal;
      document.getElementById('mobile-resumo-total').innerText = txtTotal;
      
      if(caixaAtiva) {
         document.getElementById('mobile-resumo-caixa').innerText = `${caixaAtiva.titulo}`;
      } else {
         document.getElementById('mobile-resumo-caixa').innerText = `${carrinhoDeCaixasConcluidas.length} caixas no carrinho`;
      }
      actualizarEstadoBotao();
    }

    function abrirModalEspecial(tipo) {
      if(tipo === 'personalizados') {
        document.getElementById('pers-view-inputs').classList.add('hidden');
        document.getElementById('pers-view-info').classList.remove('hidden');
        document.getElementById('modal-decorados').classList.remove('hidden');
      } else if(tipo === 'eventos') {
        document.getElementById('modal-eventos').classList.remove('hidden');
      }
    }
    
    function avancarFormularioPersonalizados() { document.getElementById('pers-view-info').classList.add('hidden'); document.getElementById('pers-view-inputs').classList.remove('hidden'); }
    function voltarLAteralPersonalizados() { document.getElementById('pers-view-inputs').classList.add('hidden'); document.getElementById('pers-view-info').classList.remove('hidden'); }
    function fecharModalPersonalizados() { document.getElementById('modal-decorados').classList.add('hidden'); }
    function fecharModalEventos() { document.getElementById('modal-eventos').classList.add('hidden'); }
    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    function lembreteCaixa() { mostrarNotificacao("Por favor, selecione primeiro o tamanho da sua caixa no Passo 1."); }
    function focarFormularioCheckout() { document.getElementById('secao-checkout')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    function mostrarFormularioInternoModal() { document.getElementById('modal-completa-estado-escolha').classList.add('hidden'); document.getElementById('modal-completa-estado-form').classList.remove('hidden'); }
    function voltarParaEstadosEscolhaModal() { document.getElementById('modal-completa-estado-form').classList.add('hidden'); document.getElementById('modal-completa-estado-escolha').classList.remove('hidden'); }
    function enviarPedidoWhatsAppPeloModal() { const nome = document.getElementById('modal-nome-cliente').value.trim(); const data = document.getElementById('modal-data-desejada').value; const hora = document.getElementById('modal-hora-desejada').value; if (!nome || !data || !hora) { alert("Por favor, preencha todos os campos do agendamento!"); return; } fecharModalCompleta(); enviarPedidoWhatsApp(); }
    
    function actualizarEstadoBotao() {
      const btn = document.getElementById('btn-whatsapp'); if (!btn) return;
      const nome = document.getElementById('nome-cliente').value.trim();
      const data = document.getElementById('data-desejada').value;
      const hora = document.getElementById('hora-desejada').value;
      if (!nome || !data || !hora) { btn.disabled = true; return; }
      
      // O botão ativa se houver caixas guardadas no carrinho OU se a caixa atual estiver completa
      if (carrinhoDeCaixasConcluidas.length > 0) {
         btn.disabled = false;
      } else if (caixaAtiva) {
         if (caixaAtiva.precoFixo) {
             btn.disabled = false;
         } else {
             btn.disabled = (Object.values(quantidades).reduce((a, b) => a + b, 0) !== caixaAtiva.totalDoces);
         }
      } else {
         btn.disabled = true;
      }
    }
    
    function openModal(src, title, price, id) {
      document.getElementById('modal-img').src = src; document.getElementById('modal-title').innerText = title; document.getElementById('modal-price').innerText = price;
      const btn = document.getElementById('modal-add-btn');
      if (caixaAtiva && !caixaAtiva.precoFixo) { btn.style.display = "block"; btn.onclick = () => { alterarQtd(id, 1); closeModal(); }; } 
      else { btn.style.display = "none"; }
      document.getElementById('modal').classList.remove('hidden');
    }

    // MONTAGEM DO WHATSAPP REFORMULADA ADAPTADA PARA PEDIDOS MULTI-CAIXAS
    function enviarPedidoWhatsApp() {
      const nome = document.getElementById('nome-cliente').value.trim(); const data = document.getElementById('data-desejada').value.split('-'); const hora = document.getElementById('hora-desejada').value; const total = document.getElementById('valor-total').innerText;
      
      let texto = `Olá, OBA Doceria! Segue meu Pedido Completo:\n\n*CLIENTE:* ${nome}\n*ENTREGA:* ${data[2]}/${data[1]}/${data[0]} às ${hora}\n\n*RESUMO DA ENCOMENDA:*\n`;
      
      // Lista as caixas salvas no histórico
      carrinhoDeCaixasConcluidas.forEach((cx, idx) => {
         texto += `*Caixa ${idx + 1}:* ${cx.titulo}\n Sabores: _${cx.detalhes}_\n\n`;
      });
      
      // Se houver uma caixa aberta e editada no momento, envia ela junto
      if (caixaAtiva) {
         if(caixaAtiva.precoFixo) {
             texto += `*Caixa Atual:* ${caixaAtiva.titulo}\n Sabores: _${multiplicadorCaixasDegustacao}x Combo Degustação Sortido_\n\n`;
         } else {
             let sab = [];
             Object.entries(quantidades).forEach(([id, q]) => { if (q > 0) sab.push(`${q}x ${encontrarDoce(id).nome}`); });
             texto += `*Caixa Atual:* ${caixaAtiva.titulo}\n Sabores: _${sab.join(', ')}_\n\n`;
         }
      }
      
      texto += `*OPCIONAIS:* ${lacoDecorativoSelecionado ? "Com Laço (🎀)" : "Sem laço"} | ${placaPersonalizadaSelecionada ? "Com Placa (🏷️)" : "Sem placa"}\n`;
      texto += `*VALOR GERAL DO PEDIDO:* ${total}`;
      window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(texto)}`, '_blank');
    }

    function enviarOrcamentoEspecial(tipo) {
      if(tipo === 'personalizados') {
        const nome = document.getElementById('nome-cliente').value.trim() || "Cliente"; const tema = document.getElementById('pers-tema').value.trim(); const data = document.getElementById('pers-data').value; const qtd = document.getElementById('pers-qtd').value || "Não informada"; if (!tema || !data) { alert("Preencha os campos obrigatórios!"); return; } const d = data.split('-');
        const msg = `Olá, OBA Doceria! Solicito reserva de *Doces Personalizados & Decorados*:\n\n*Nome:* ${nome}\n*Tema:* ${tema}\n*Data:* ${d[2]}/${d[1]}/${d[0]}\n*Quantidade:* ${qtd}`;
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank'); fecharModalPersonalizados();
      } else {
        const nome = document.getElementById('eve-nome').value.trim(); const tipoEv = document.getElementById('eve-tipo').value.trim(); const data = document.getElementById('eve-data').value; const conv = document.getElementById('eve-convidados').value || "Não informado"; const qtd = document.getElementById('eve-qtd').value || "Não informada"; if (!nome || !tipoEv || !data) { alert("Preencha os campos obrigatórios!"); return; } const d = data.split('-');
        const msg = `Olá, OBA Doceria! Solicito orçamento para *Casamentos, Formaturas & Eventos*:\n\n*Nome:* ${nome}\n*Tipo:* ${tipoEv}\n*Data:* ${d[2]}/${d[1]}/${d[0]}\n*Convidados:* ${conv}\n*Quantidade de Doces:* ${qtd}`;
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank'); fecharModalEventos();
      }
    }
    
    function mostrarNotificacao(m) { const toast = document.getElementById('custom-toast'); const txt = document.getElementById('toast-text'); if (txt && toast) { txt.innerText = m; toast.className = "fixed bottom-24 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl text-white opacity-100 bg-[#8B4513] transition-all"; setTimeout(() => { toast.className = "fixed bottom-24 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl opacity-0 pointer-events-none"; }, 3000); } }

  </script>
