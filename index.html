<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oficina Presenteáveis | OBA Doceria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .cart-scroll::-webkit-scrollbar { width: 4px; }
    .cart-scroll::-webkit-scrollbar-thumb { background-color: #E8D5B5; border-radius: 10px; }
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; color: #3B2A1E; }
    .btn-step-icon { background-color: #8B4513; color: white; width: 22px; height: 22px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  </style>
</head>
<body class="antialiased pb-20">

  <a href="https://wa.me/5555999117626" target="_blank" class="fixed bottom-6 right-6 z-[60] bg-[#25D366] text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl hover:bg-green-600 transition-all"><i class="fa-brands fa-whatsapp"></i></a>

  <div id="modal-caixa-completa" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4" onclick="fecharModalCompleta()">
    <div class="bg-white max-w-md w-full rounded-[2rem] p-6 relative shadow-2xl text-center space-y-4" onclick="event.stopPropagation()">
      <button onclick="fecharModalCompleta()" class="absolute top-4 right-4 text-gray-500 font-bold">✕</button>
      <h2 id="modal-titulo-dinamico" class="text-xl font-black text-[#8B4513]">Nome do Kit</h2>
      <p id="modal-desc-dinamica" class="text-[11px] text-gray-500"></p>
      <p class="text-sm font-semibold border-b pb-3">Valor: <span id="modal-subtotal-pedido" class="text-xl font-black text-[#8B4513]">R$ 0,00</span></p>
      <div class="space-y-2 text-left">
        <div onclick="toggleOpcional('laco')" class="border p-3 rounded-2xl flex justify-between cursor-pointer"><div class="flex items-center gap-3"><div id="chk-laco" class="w-5 h-5 rounded border-2 border-[#8B4513]"></div><h4 class="text-[11px] font-bold uppercase">Laço Decorativo</h4></div><span class="text-[11px] font-black">+ R$ 4,50</span></div>
        <div onclick="toggleOpcional('placa')" class="border p-3 rounded-2xl flex justify-between cursor-pointer"><div class="flex items-center gap-3"><div id="chk-placa" class="w-5 h-5 rounded border-2 border-[#8B4513]"></div><h4 class="text-[11px] font-bold uppercase">Placa Personalizada</h4></div><span class="text-[11px] font-black">+ R$ 3,50</span></div>
      </div>
      <button onclick="adicionarAoCarrinho('continuar')" class="w-full py-3 bg-green-600 text-white font-bold text-[10px] rounded-xl uppercase">Adicionar</button>
    </div>
  </div>

  <div id="modal-carrinho" class="fixed inset-0 bg-black/80 hidden z-[110] flex items-center justify-center p-4" onclick="fecharModalCarrinho()">
    <div class="bg-white w-full max-w-lg rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <h2 class="text-lg font-black text-[#8B4513] uppercase border-b pb-4 mb-4">Seu Carrinho</h2>
      <div id="conteudo-modal-carrinho" class="flex-1 overflow-y-auto cart-scroll space-y-3 pb-4"></div>
      <div class="space-y-3 pt-4 border-t">
        <input type="text" id="cli-nome" placeholder="Nome *" class="w-full p-3 border rounded-lg text-sm">
        <div class="grid grid-cols-2 gap-2">
            <input type="date" id="cli-data" class="text-sm p-3 border rounded-lg">
            <input type="time" id="cli-hora" class="text-sm p-3 border rounded-lg">
        </div>
        <select id="cli-pagamento" class="w-full text-sm p-3 border rounded-lg"><option value="">Pagamento *</option><option>Pix</option><option>Dinheiro</option></select>
        <button id="btn-finalizar" onclick="finalizarPedidoBlindado()" disabled class="w-full py-4 bg-gray-300 text-white font-black rounded-xl uppercase">Preencha os dados</button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8"><div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full"></div></main>

  <script>
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake, uva verde e morangos.', precoFixo: 180.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_1.png' },
      { id: 'kit_classico', nome: 'Caixa Presente Clássica', desc: '12 brigadeiros em caixa com laço.', precoFixo: 75.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_2.png' }
    ];
    let carrinhoDeItens = [], kitAtivo = null, laco = false, placa = false;
    const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbzzexSBR6WVLjcWH2Fp5TfKuZivAR-BoT4m3CufvgnBoz_ku45ITasE1SxnuJ3HQxFXpw/exec';

    function renderizarKits() {
      document.getElementById('kits-grid').innerHTML = kitsPresenteaveis.map(k => `
        <div class="bg-white p-4 rounded-3xl border shadow-sm">
          <img src="${k.img}" class="w-full h-56 object-cover rounded-xl">
          <h3 class="font-black mt-4">${k.nome}</h3>
          <p class="text-xs text-gray-500">${k.desc}</p>
          <button onclick="abrirModalKit('${k.id}')" class="w-full mt-4 py-3 bg-[#8B4513] text-white rounded-xl font-bold uppercase text-[10px]">Configurar</button>
        </div>`).join('');
    }

    function abrirModalKit(id) {
        kitAtivo = kitsPresenteaveis.find(k => k.id === id);
        document.getElementById('modal-titulo-dinamico').innerText = kitAtivo.nome;
        document.getElementById('modal-subtotal-pedido').innerText = "R$ " + kitAtivo.precoFixo.toFixed(2);
        document.getElementById('modal-caixa-completa').classList.remove('hidden');
    }

    function toggleOpcional(tipo) {
        if(tipo === 'laco') laco = !laco; else placa = !placa;
        document.getElementById('chk-'+tipo).classList.toggle('bg-[#8B4513]');
        document.getElementById('chk-'+tipo).querySelector('i').classList.toggle('opacity-0');
        let total = kitAtivo.precoFixo + (laco?4.5:0) + (placa?3.5:0);
        document.getElementById('modal-subtotal-pedido').innerText = "R$ " + total.toFixed(2);
    }

    function adicionarAoCarrinho(acao) {
        let total = kitAtivo.precoFixo + (laco?4.5:0) + (placa?3.5:0);
        carrinhoDeItens.push({titulo: kitAtivo.nome, precoCalculadoUnitario: total, quantidade: 1, detalhes: "Kit"});
        fecharModalCompleta();
        if(acao === 'carrinho') abrirModalCarrinho();
    }

    async function finalizarPedidoBlindado() {
        const nome = document.getElementById('cli-nome').value, data = document.getElementById('cli-data').value, hora = document.getElementById('cli-hora').value, pag = document.getElementById('cli-pagamento').value;
        let total = carrinhoDeItens.reduce((a, b) => a + (b.precoCalculadoUnitario * b.quantidade), 0);
        try { await fetch(URL_WEB_APP, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nome, total, entrega: `${data} ${hora}`, pag }) }); } catch(e) {}
        let msg = `🛒 *PEDIDO OBA*\n*Cliente:* ${nome}\n*Total:* R$ ${total.toFixed(2)}`;
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Handlers
    document.querySelectorAll('#cli-nome, #cli-data, #cli-hora, #cli-pagamento').forEach(el => el.addEventListener('change', () => {
        const ok = ['cli-nome','cli-data','cli-hora','cli-pagamento'].every(id => document.getElementById(id).value !== "");
        document.getElementById('btn-finalizar').disabled = !ok;
        document.getElementById('btn-finalizar').className = ok ? "w-full py-4 bg-green-600 text-white font-black rounded-xl uppercase" : "w-full py-4 bg-gray-300 text-white font-black rounded-xl uppercase";
        document.getElementById('btn-finalizar').innerText = ok ? "Enviar Pedido Seguro" : "Preencha os dados";
    }));

    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }
    function abrirModalCarrinho() { document.getElementById('modal-carrinho').classList.remove('hidden'); }
    function fecharModalCarrinho() { document.getElementById('modal-carrinho').classList.add('hidden'); }

    renderizarKits();
  </script>
</body>
</html>
