<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #FDFBF7; color: #5D3A1A; }
    .font-serif-gourmet { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

  <!-- PÁGINA 1: BOAS-VINDAS - MODERNA E IMERSIVA -->
  <section id="pag-1" class="w-full max-w-sm flex flex-col items-center animate-in fade-in duration-1000">
      
      <!-- 1. Logo (Maior, ocupando o espaço com autoridade) -->
      <div class="w-full mb-12">
          <img src="https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Logo_Oba/logo-horizontal.png" 
               class="w-full max-w-[320px] mx-auto drop-shadow-lg" 
               alt="Logo OBA">
      </div>

      <!-- 2. Área de Texto (Hierarquia refinada) -->
      <div class="text-center mb-16 px-4">
          <h1 class="font-serif-gourmet text-5xl italic text-[#5D3A1A] mb-8 tracking-tighter">Bem-vindo</h1>
          <p class="text-[#8B4513]/70 text-lg leading-relaxed font-light">
              Descubra o verdadeiro sabor artesanal, feito com <span class="font-semibold text-[#5D3A1A]">precisão</span> e <span class="font-semibold text-[#5D3A1A]">amor</span>.
          </p>
      </div>

      <!-- 3. Botão (Moderno, minimalista e com toque premium) -->
      <button onclick="navegarPara('pag-2')" 
              class="w-full py-5 rounded-2xl bg-[#5D3A1A] text-white font-bold tracking-[0.2em] uppercase text-xs shadow-xl transition-all active:scale-95 hover:bg-[#4a2e16]">
          Descobrir Nossa História
      </button>
  </section>

  <script>
    function navegarPara(id) { /* Logica de navegação */ }
  </script>
</body>
</html>
