<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; color: #3B2A1E; }
    .glass-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(139, 69, 19, 0.08); }
    .fade-page { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="antialiased pb-20">

  <div id="app-container" class="w-full max-w-6xl mx-auto overflow-hidden relative min-h-screen">

    <section id="fluxo-principal" class="min-h-screen flex flex-col px-4 py-8 fade-page">
      <header class="text-center mb-8">
        <img src="https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Logo_Oba/logo-horizontal.png" class="w-32 mx-auto mb-4" alt="Logo">
        <button onclick="retornarParaMenuSeletor()" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest border border-gray-200 px-4 py-1.5 rounded-full">← Voltar às Opções</button>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pb-10">
        <div class="lg:col-span-8 space-y-8">
          
          <div id="secao-kits" class="hidden space-y-6">
             <div class="bg-white p-6 rounded-[2rem] border border-[#E8D5B5] shadow-sm">
               <h3 class="font-black text-lg text-[#8B4513] uppercase tracking-widest"><i class="fa-solid fa-gift mr-2"></i> Vitrine de Presentes</h3>
             </div>
             <div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
          </div>

          <div id="secao-passo1" class="hidden bg-white p-6 rounded-[2rem] border border-[#E8D5B5] shadow-sm">
            <h3 class="font-black text-sm text-[#8B4513] uppercase mb-4">1. Escolha o tamanho da caixa</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="opcoes-caixas">
              <button onclick="selecionarCaixa('25')" class="p-4 bg-white border border-[#E8D5B5] rounded-2xl shadow-sm">Caixa 25</button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-4 lg:sticky lg:top-4 h-fit">
            <div id="lista-carrinho-caixas" class="space-y-2 mb-4"></div>
            <div id="valor-total" class="text-2xl font-black text-[#8B4513]">R$ 0,00</div>
        </div>
      </div>
    </section>

  </div>

  <script>
    // --- DADOS ---
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake, frutas e doces.', preco: 180.00, img: 'https://placehold.co/400x300?text=Tábua' },
      { id: 'kit_classico', nome: 'Caixa Presente Clássica', desc: '12 brigadeiros em caixa com laço.', preco: 75.00, img: 'https://placehold.co/400x300?text=Caixa' }
    ];
    let carrinhoDeCaixasConcluidas = [];

    // --- NAVEGAÇÃO ---
    function navegarPara(num) {
      document.getElementById('fluxo-principal').classList.add('hidden');
      if(num === 4) document.getElementById('fluxo-principal').classList.remove('hidden');
    }

    function entFluxoPresenteaveis() {
      navegarPara(4);
      document.getElementById('secao-kits').classList.remove('hidden');
      document.getElementById('secao-passo1').classList.add('hidden');
      renderizarKits();
    }

    // --- VITRINE DE KITS (INTEGRADA) ---
    function renderizarKits() {
      const grid = document.getElementById('kits-grid');
      grid.innerHTML = "";
      kitsPresenteaveis.forEach(kit => {
        grid.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow border border-gray-100">
            <img src="${kit.img}" class="w-full h-32 object-cover rounded-xl mb-3">
            <h3 class="font-black text-xs text-[#8B4513]">${kit.nome}</h3>
            <p class="text-[10px] text-gray-500 mb-2">${kit.desc}</p>
            <p class="text-sm font-bold text-[#8B4513] mb-3">R$ ${kit.preco.toFixed(2).replace('.', ',')}</p>
            <button onclick="adicionarKitAoCarrinho('${kit.id}')" class="w-full py-2 bg-[#8B4513] text-white text-[10px] font-bold rounded-lg uppercase">Adicionar</button>
          </div>`;
      });
    }

    function adicionarKitAoCarrinho(idKit) {
      const kit = kitsPresenteaveis.find(k => k.id === idKit);
      carrinhoDeCaixasConcluidas.push({ 
        titulo: kit.nome, 
        precoCalculado: kit.preco, 
        detalhes: "Kit Fechado (Sem seleção de sabores)", 
        isKit: true 
      });
      atualizarPainelCarrinhoLateral();
      alert(kit.nome + " adicionado ao carrinho!");
    }

    function atualizarPainelCarrinhoLateral() {
      const containerLista = document.getElementById('lista-carrinho-caixas');
      containerLista.innerHTML = "";
      carrinhoDeCaixasConcluidas.forEach((cx, index) => {
        containerLista.innerHTML += `
          <div class="bg-gray-50 p-2 rounded-lg text-xs">
            <p class="font-bold text-[#8B4513]">${cx.titulo}</p>
            <p class="text-[9px]">${cx.detalhes} - R$ ${cx.precoCalculado.toFixed(2).replace('.', ',')}</p>
          </div>`;
      });
      calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        carrinhoDeCaixasConcluidas.forEach(cx => total += cx.precoCalculado);
        document.getElementById('valor-total').innerText = "R$ " + total.toFixed(2).replace('.', ',');
    }
  </script>
</body>
</html>
