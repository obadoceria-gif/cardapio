<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fontes do Manual de Estilo OBA -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #FDFBF7; color: #5D3A1A; }
    .font-serif-gourmet { font-family: 'Playfair Display', serif; }
    .fade-in { animation: fadeIn 0.8s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- CONTAINER DE NAVEGAÇÃO -->
  <div id="app-container" class="w-full">
    
    <!-- PÁGINA 1: BOAS-VINDAS (MODULAR E SEGUINDO MANUAL DE ESTILO) -->
    <section id="pag-1" class="w-full max-w-sm mx-auto flex flex-col items-center fade-in">
      <div class="w-full mb-14">
          <img src="https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Logo_Oba/logo-horizontal.png" 
               class="w-full max-w-[280px] mx-auto drop-shadow-sm" 
               alt="Logo OBA">
      </div>
      <div class="text-center mb-16 px-4 space-y-4">
          <h1 class="font-serif-gourmet text-5xl italic text-[#5D3A1A]/90">Bem-vindo</h1>
          <p class="text-[#8B4513]/60 text-lg font-light tracking-wide pt-2 italic">Sabor artesanal em cada detalhe.</p>
      </div>
      <button onclick="navegarPara('pag-2')" 
              class="w-full py-5 bg-[#7A431D] text-[#FDFBF7] rounded-full font-semibold tracking-[0.2em] uppercase text-[10px] shadow-xl shadow-[#7A431D]/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
          Iniciar Jornada
      </button>
    </section>

    <!-- PÁGINA 2: NOSSA ESSÊNCIA (MODULAR) -->
    <section id="pag-2" class="hidden w-full max-w-sm mx-auto flex flex-col items-center fade-in">
        <div class="text-center p-6">
            <h2 class="font-serif-gourmet text-4xl mb-8">Nossa Essência</h2>
            <p class="mb-10 text-[#5D3A1A]/80">Aqui você conta a história da OBA Doceria.</p>
            <button onclick="navegarPara('pag-1')" class="text-[#7A431D] underline text-sm">Voltar</button>
        </div>
    </section>

  </div>

  <script>
    function navegarPara(id) {
        document.querySelectorAll('#app-container > section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
