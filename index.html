<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #FDFBF7; color: #5D3A1A; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- CONTAINER DE NAVEGAÇÃO -->
  <div id="app-container">
    
    <!-- TELA 1: BOAS-VINDAS -->
    <section id="pag-1" class="min-h-screen flex flex-col items-center justify-center p-6 fade-in">
        <img src="https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Logo_Oba/logo-vertical.png" class="w-40 mb-8">
        <h1 class="text-2xl font-black mb-2">BEM-VINDO</h1>
        <p class="text-sm opacity-70 text-center mb-10 max-w-[200px]">Prepare-se para descobrir o verdadeiro sabor artesanal em cada detalhe.</p>
        <button onclick="navegarPara('pag-2')" class="bg-[#965121] text-white px-10 py-4 rounded-full font-bold shadow-xl transition-all hover:bg-[#7a421a]">
            DESCOBRIR NOSSA HISTÓRIA <i class="fa-solid fa-chevron-right text-xs ml-2"></i>
        </button>
    </section>

    <!-- PÁGINAS 2 E 3 FICARÃO AQUI -->
    <section id="pag-2" class="hidden">...</section>
    <section id="pag-3" class="hidden">...</section>
  </div>

  <!-- FLUXO DE MONTAGEM (INTEGRADO) -->
  <div id="fluxo-montagem" class="hidden">
      <!-- AQUI ENTRA TODO O SEU CONTEÚDO ORIGINAL DE VITRINE E MODAIS -->
  </div>

  <script>
    // FUNÇÃO DE NAVEGAÇÃO
    function navegarPara(id) {
        document.querySelectorAll('#app-container > section, #fluxo-montagem').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function iniciarMontagem() {
        navegarPara('fluxo-montagem');
        // As funções de renderizar são do seu código original
        renderizarAbasCategorias();
        renderizarDoces();
    }
  </script>
</body>
</html>
