<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Catálogo Artesanal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E]">

  <!-- Header -->
  <header class="py-10 text-center">
    <h1 class="text-4xl font-bold text-[#8B4513]">OBA Doceria</h1>
    <p class="text-[#D8B36A] uppercase tracking-widest text-sm mt-2">O verdadeiro sabor artesanal</p>
  </header>

  <!-- Vitrine -->
  <main class="max-w-4xl mx-auto px-4 pb-20">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      
      <!-- Exemplo de item (Ninho) -->
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-[#E8D5B5]">
        <img src="WhatsApp Image 2026-06-08 at 11.30.15.jpeg" alt="Brigadeiro de Ninho" class="w-full h-40 object-cover rounded-xl mb-2">
        <h3 class="font-bold text-sm">Ninho</h3>
        <p class="text-xs text-stone-500">Clássicos</p>
        <button class="w-full mt-3 py-2 bg-[#8B4513] text-white rounded-lg text-xs font-bold">+ Selecionar</button>
      </div>

      <!-- Exemplo de item (Pistache) -->
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-[#E8D5B5]">
        <img src="WhatsApp Image 2026-06-08 at 11.30.15 (4).jpeg" alt="Brigadeiro de Pistache" class="w-full h-40 object-cover rounded-xl mb-2">
        <h3 class="font-bold text-sm">Pistache</h3>
        <p class="text-xs text-stone-500">Especiais</p>
        <button class="w-full mt-3 py-2 bg-[#8B4513] text-white rounded-lg text-xs font-bold">+ Selecionar</button>
      </div>

    </div>
  </main>

  <!-- Botão Flutuante Pedido -->
  <div class="fixed bottom-6 left-0 right-0 px-4">
    <button class="w-full py-4 bg-[#D8B36A] text-[#3B2A1E] font-bold rounded-2xl shadow-lg hover:bg-[#c6a25e] transition">
      Montar Meu Pedido (WhatsApp)
    </button>
  </div>

</body>
</html>
