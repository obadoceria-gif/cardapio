<!DOCTYPE html>
<html>
<body>
    <button onclick="simularPedido()">Testar Fechamento de Pedido</button>

    <script>
        // O motor do seu pedido
        async function simularPedido() {
            const pedido = {
                nome: "Teste Sergio",
                total: 180.00,
                entrega: "2026-06-29 10:00",
                pag: "Pix"
            };

            const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbzzexSBR6WVLjcWH2Fp5TfKuZivAR-BoT4m3CufvgnBoz_ku45ITasE1SxnuJ3HQxFXpw/exec';

            try {
                console.log("Enviando pedido...");
                const response = await fetch(URL_WEB_APP, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(pedido) 
                });
                console.log("Pedido enviado com sucesso para o Apps Script");
                alert("Pedido disparado! Verifique sua planilha.");
            } catch(e) {
                console.error("Erro na comunicação:", e);
                alert("Erro ao enviar: " + e.message);
            }
        }
    </script>
</body>
</html>
