<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #FDFBF7; color: #5D3A1A; }
    .fade-in { animation: fadeIn 0.6s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- PÁGINA 1: BOAS-VINDAS (LAYOUT MINIMALISTA E SOFISTICADO) -->
    <section id="pag-1" class="min-h-screen flex flex-col items-center justify-between py-16 px-8 relative overflow-hidden fade-in">
        
        <!-- Fundo sutil -->
        <div class="absolute inset-0 opacity-[0.04] bg-[url('https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Imagens_Layout/Captura%20de%20tela%202026-06-23%20131033.png')] bg-cover bg-center"></div>

        <!-- 1. Logo (Espaço no topo) -->
        <div class="mt-8 z-10">
            <img src="LINK_DO_SEU_LOGO_TRANSPARENTE.png" 
                 class="w-40 md:w-56 mx-auto drop-shadow-sm" alt="Logo OBA">
        </div>

        <!-- 2. Texto (Centralizado com respiro) -->
        <div class="text-center z-10 flex flex-col items-center">
            <h1 class="text-2xl font-bold tracking-[0.2em] uppercase mb-4">Bem-vindo</h1>
            <div class="h-px w-12 bg-[#5D3A1A]/20 mb-6"></div> 
            <p class="text-[#8B4513]/80 leading-relaxed max-w-[220px] text-sm font-light">
                Prepare-se para descobrir o verdadeiro sabor artesanal em cada detalhe.
            </p>
        </div>

        <!-- 3. Botão (Design moderno "Outline") -->
        <button onclick="navegarPara('pag-2')" 
                class="w-full max-w-[280px] border border-[#5D3A1A] py-4 rounded-full font-bold tracking-widest text-xs hover:bg-[#5D3A1A] hover:text-white transition-all duration-500 z-10">
            DESCOBRIR NOSSA HISTÓRIA
        </button>
    </section>

    <!-- PÁGINAS 2 e 3 -->
    <section id="pag-2" class="hidden min-h-screen flex items-center justify-center fade-in">
        <div class="text-center p-6">
            <h2 class="text-2xl font-black mb-6">Página 2: Nossa Essência</h2>
            <button onclick="navegarPara('pag-3')" class="bg-[#8B4513] text-white px-8 py-3 rounded-xl">Próximo</button>
        </div>
    </section>

    <section id="pag-3" class="hidden min-h-screen flex items-center justify-center fade-in">
        <div class="text-center p-6">
            <h2 class="text-2xl font-black mb-6">Página 3: Escolha a Experiência</h2>
            <button onclick="iniciarMontagem()" class="bg-[#8B4513] text-white px-8 py-3 rounded-xl">Ir para o Cardápio</button>
        </div>
    </section>
  </div>

  <div id="fluxo-montagem" class="hidden"></div>

  <script>
    function navegarPara(id) {
        document.querySelectorAll('#app-container > section, #fluxo-montagem').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
