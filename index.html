<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #FAF7F2; color: #5D3A1A; }
    .fade-in { animation: fadeIn 0.6s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- PÁGINA 1: BOAS-VINDAS (REFINADA) -->
    <section id="pag-1" class="min-h-screen flex flex-col items-center justify-between py-12 px-6 relative bg-[#FAF7F2] fade-in">
        
        <!-- 1. Logo Minimalista (Topo) -->
        <div class="mt-4 opacity-90 z-10">
            <img src="https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Logo_Oba/logo-horizontal.png" 
                 class="w-32" alt="Logo OBA">
        </div>

        <!-- 2. Área de Texto Imersiva -->
        <div class="flex flex-col items-center text-center space-y-6 z-10">
            <h1 class="text-4xl font-light text-[#5D3A1A] tracking-tighter">Bem-vindo</h1>
            <p class="text-[#8B4513]/60 text-sm italic leading-relaxed max-w-[240px]">
                Descubra o verdadeiro sabor artesanal, feito com precisão e amor em cada detalhe.
            </p>
        </div>

        <!-- 3. Botão de Entrada (Estilizado) -->
        <button onclick="navegarPara('pag-2')" 
                class="mb-8 w-full max-w-[260px] py-4 rounded-[40px] border border-[#5D3A1A]/30 text-[#5D3A1A] font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-[#5D3A1A] hover:text-white transition-all duration-300 z-10">
            Iniciar Jornada
        </button>
    </section>

    <!-- PÁGINAS 2 e 3 -->
    <section id="pag-2" class="hidden min-h-screen flex items-center justify-center fade-in">
        <div class="text-center p-6">
            <h2 class="text-2xl font-black mb-6">Página 2: Nossa Essência</h2>
            <button onclick="navegarPara('pag-3')" class="bg-[#8B4513] text-white px-8 py-3 rounded-xl">Próximo</button>
        </div>
    </section>

    <section id="pag-3" class="hidden min-h-screen flex items-center justify-center fade-in">
        <div class="text-center p-6">
            <h2 class="text-2xl font-black mb-6">Página 3: Escolha a Experiência</h2>
            <button onclick="iniciarMontagem()" class="bg-[#8B4513] text-white px-8 py-3 rounded-xl">Ir para o Cardápio</button>
        </div>
    </section>
  </div>

  <div id="fluxo-montagem" class="hidden"></div>

  <script>
    function navegarPara(id) {
        document.querySelectorAll('#app-container > section, #fluxo-montagem').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function iniciarMontagem() {
        navegarPara('fluxo-montagem');
    }
  </script>
</body>
</html>
