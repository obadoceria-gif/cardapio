<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Cardápio Interativo Oficial 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E] font-sans antialiased">

  <div id="custom-toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 max-w-sm w-11/12 transform translate-y-0 opacity-0 pointer-events-none">
    <span id="toast-text" class="font-bold text-center w-full"></span>
  </div>

  <div id="modal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-2" onclick="closeModal()">
    <div class="bg-white max-w-2xl w-full max-h-[90vh] rounded-3xl p-4 relative shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-black bg-opacity-20 rounded-full p-2 z-10 text-white text-xl">✕</button>
      <div class="w-full h-[50vh] flex items-center justify-center bg-gray-50 rounded-2xl mb-6 overflow-hidden">
          <img id="modal-img" src="" alt="Doce" class="max-h-full max-w-full object-contain" onerror="handleImageError(this, this.alt)">
      </div>
      <div class="px-2">
        <h2 id="modal-title" class="text-3xl font-bold text-[#8B4513] mb-3"></h2>
        <p id="modal-desc" class="text-lg text-gray-700 mb-8 leading-relaxed"></p>
        <div class="flex items-center justify-between border-t border-gray-100 pt-6">
          <span id="modal-price" class="text-2xl font-bold text-[#8B4513]"></span>
          <button id="modal-add-btn" class="px-10 py-4 bg-[#8B4513] text-white rounded-2xl font-bold shadow-lg hover:bg-[#6e3710] transition-transform active:scale-95">Adicionar ao Pedido</button>
        </div>
      </div>
    </div>
  </div>

  <header class="py-12 text-center bg-gradient-to-b from-[#FFF0E0] to-[#FFF8F0] px-4">
    <h1 class="text-5xl font-extrabold text-[#8B4513] tracking-tight">OBA Doceria</h1>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-32">
    <div id="cardapio-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6"></div>
  </main>

  <script>
    const catalogo = [
      { id: "ninho", nome: "Leite Ninho", preco: 2.50, img: "Images/Leite Ninho.jpeg" },
      { id: "nesquik", nome: "Nesquik", preco: 2.50, img: "Images/Nesquik.jpeg" },
      { id: "casadinho", nome: "Casadinho", preco: 2.50, img: "Images/Casadinho.jpeg" }
    ];

    function renderizarDoces() {
      const grid = document.getElementById('cardapio-grid');
      grid.innerHTML = "";
      catalogo.forEach(item => {
        grid.innerHTML += `
          <div class="bg-white rounded-3xl shadow-md border border-[#E8D5B5] flex flex-col items-center text-center overflow-hidden transition-all hover:shadow-lg w-full">
            <div class="w-full aspect-square flex items-center justify-center bg-gray-50 overflow-hidden">
              <img src="${item.img}" alt="${item.nome}" class="h-full w-full object-cover">
            </div>
            <div class="p-4 w-full">
              <h3 class="font-bold text-sm md:text-base mb-1 text-[#3B2A1E]">${item.nome}</h3>
              <button onclick="openModal('${item.img}', '${item.nome}', 'R$ ${item.preco.toFixed(2).replace('.', ',')}')" class="text-xs text-[#8B4513] underline">Ver detalhes</button>
            </div>
          </div>
        `;
      });
    }

    function openModal(src, title, price) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    window.onload = renderizarDoces;
  </script>
</body>
</html>
