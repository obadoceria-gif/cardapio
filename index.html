<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Cardápio 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E]">

  <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white max-w-2xl w-full rounded-3xl p-8 relative shadow-2xl" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-2xl font-bold">✕</button>
      <h2 id="modal-title" class="text-3xl font-extrabold text-[#8B4513] mb-6 text-center"></h2>
      
      <div class="w-full h-[50vh] flex items-center justify-center bg-gray-50 rounded-2xl mb-8 border border-gray-100">
        <img id="modal-img" src="" alt="Doce" class="max-h-full max-w-full object-contain p-2">
      </div>
      
      <div class="flex items-center justify-between border-t border-gray-100 pt-6">
        <span id="modal-price" class="text-3xl font-black text-[#8B4513]"></span>
        <button id="modal-add-btn" class="px-10 py-4 bg-[#8B4513] text-white rounded-2xl font-bold hover:bg-[#6e3710] text-lg"></button>
      </div>
    </div>
  </div>

  <header class="py-12 text-center">
    <h1 class="text-5xl font-extrabold text-[#8B4513]">OBA Doceria</h1>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-32">
    <div id="cardapio-grid" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const catalogo = [
      { id: "leite_ninho", nome: "Leite Ninho", preco: 2.50, img: "Images/Leite Ninho.jpeg" },
      { id: "nesquik", nome: "Nesquik", preco: 2.50, img: "Images/Nesquik.jpeg" },
      { id: "casadinho", nome: "Casadinho", preco: 2.50, img: "Images/Casadinho.jpeg" }
    ];

    function renderizarDoces() {
      const grid = document.getElementById('cardapio-grid');
      grid.innerHTML = "";
      catalogo.forEach(item => {
        grid.innerHTML += `
          <div class="bg-white rounded-3xl shadow-sm border border-[#E8D5B5] p-4 flex flex-col items-center text-center">
            <div class="w-full aspect-square bg-gray-50 rounded-2xl mb-4 overflow-hidden flex items-center justify-center">
               <img src="${item.img}" alt="${item.nome}" class="w-full h-full object-contain p-2">
            </div>
            <h3 class="font-bold text-lg text-[#3B2A1E]">${item.nome}</h3>
            <button onclick="openModal('${item.img}', '${item.nome}', 'R$ ${item.preco.toFixed(2).replace('.', ',')}')" class="text-[#8B4513] underline text-sm mt-2">Ver detalhes</button>
          </div>
        `;
      });
    }

    function openModal(src, title, price) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal-add-btn').innerText = "Selecionar Caixa Primeiro";
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    
    window.onload = renderizarDoces;
  </script>
</body>
</html>
