<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E]">

  <header class="py-10 text-center">
    <h1 class="text-4xl font-bold text-[#8B4513]">OBA Doceria</h1>
    <p class="text-[#D8B36A] uppercase tracking-widest text-sm mt-2">O sabor artesanal</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-20">
    <div class="grid grid-cols-2 gap-4">
      
      <!-- Brigadeiro 1 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-[#E8D5B5]">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (1).jpeg" alt="Doce" class="w-full h-32 object-cover rounded-lg mb-2">
        <h3 class="font-bold text-sm">Brigadeiro</h3>
        <button class="w-full mt-3 py-2 bg-[#8B4513] text-white rounded-lg text-xs">+ Selecionar</button>
      </div>

      <!-- Brigadeiro 2 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-[#E8D5B5]">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (2).jpeg" alt="Doce" class="w-full h-32 object-cover rounded-lg mb-2">
        <h3 class="font-bold text-sm">Brigadeiro</h3>
        <button class="w-full mt-3 py-2 bg-[#8B4513] text-white rounded-lg text-xs">+ Selecionar</button>
      </div>

    </div>
  </main>

  <div class="fixed bottom-6 left-4 right-4">
    <button class="w-full py-4 bg-[#D8B36A] text-[#3B2A1E] font-bold rounded-2xl shadow-lg">
      Montar Meu Pedido
    </button>
  </div>

</body>
</html>
