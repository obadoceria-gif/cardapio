<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho Estilizado</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 20px; }
    .cart {
      width: 400px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .cart-header {
      padding: 15px;
      background: #007bff;
      color: #fff;
      font-weight: bold;
    }
    .cart-items {
      max-height: 220px;
      overflow-y: auto;
      padding: 15px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .cart-item span:first-child {
      font-weight: 500;
      color: #333;
    }
    .cart-item span:last-child {
      font-weight: bold;
      color: #28a745;
    }
    .cart-footer {
      padding: 15px;
      background: #f9f9f9;
      border-top: 1px solid #eee;
    }
    .cart-footer p {
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-secondary { background: #28a745; color: #fff; margin-top: 10px; }
    #order-summary {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #order-summary h3 {
      margin-top: 0;
      color: #007bff;
    }
    #order-summary p {
      margin: 6px 0;
      font-size: 14px;
    }
    #order-summary strong {
      font-size: 16px;
      color: #28a745;
    }
  </style>
</head>
<body>

<h2>🛒 Exemplo de Carrinho Estilizado</h2>
<div class="cart">
  <div class="cart-header">
    Carrinho (<span id="cart-count">0</span> itens)
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <p>Total: R$ <span id="cart-total">0,00</span></p>
    <button class="btn-primary" onclick="gerarResumo()">Finalizar Pedido</button>
    <button class="btn-secondary" onclick="gerarImagem()">Gerar Imagem Segura</button>
  </div>
</div>

<div id="order-summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let cart = [];
function addToCart(name, price) {
  cart.push({name, price});
  renderCart();
}
function renderCart() {
  const itemsDiv = document.querySelector('.cart-items');
  itemsDiv.innerHTML = '';
  let total = 0;
  cart.forEach(item => {
    total += item.price;
    itemsDiv.innerHTML += `<div class="cart-item">
      <span>🍫 ${item.name}</span>
      <span>R$ ${item.price.toFixed(2)}</span>
    </div>`;
  });
  document.getElementById('cart-count').innerText = cart.length;
  document.getElementById('cart-total').innerText = total.toFixed(2);
}

// Gera resumo detalhado
function gerarResumo() {
  let resumoDiv = document.getElementById('order-summary');
  resumoDiv.innerHTML = "<h3>📦 Pedido #" + Date.now() + "</h3>";
  let total = 0;
  cart.forEach(item => {
    resumoDiv.innerHTML += `<p>• ${item.name} — <strong>R$ ${item.price.toFixed(2)}</strong></p>`;
    total += item.price;
  });
  resumoDiv.innerHTML += `<p><strong>Total: R$ ${total.toFixed(2)}</strong></p>`;
  resumoDiv.innerHTML += `<p><em>Data: ${new Date().toLocaleString()}</em></p>`;
}

// Gera imagem segura
function gerarImagem() {
  html2canvas(document.querySelector("#order-summary")).then(canvas => {
    const imgData = canvas.toDataURL("image/png");
    let img = document.createElement("img");
    img.src = imgData;
    img.style.maxWidth = "400px";
    img.style.marginTop = "15px";
    document.body.appendChild(img);
    alert("Imagem do pedido gerada com segurança!");
  });
}

// Teste inicial
addToCart("Tábua Doce Artesanal", 188);
addToCart("Caixa Presente Clássica", 75);
addToCart("Produto Extra", 120);
addToCart("Outro Produto", 60);
</script>

</body>
</html>
