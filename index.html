<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E]">

  <!-- Modal de Detalhes -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white max-w-lg w-full rounded-3xl p-0 relative shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-white bg-opacity-50 rounded-full p-2 z-10 text-gray-800">✕</button>
      
      <!-- Imagem inteira no topo -->
      <img id="modal-img" src="" alt="Doce" class="w-full h-72 object-contain bg-gray-50">
      
      <div class="p-6">
        <h2 id="modal-title" class="text-2xl font-bold text-[#8B4513] mb-2"></h2>
        <p id="modal-desc" class="text-base text-gray-700 mb-6 leading-relaxed"></p>
        
        <div class="flex items-center justify-between mt-4">
          <spanpx-8  class="text-xl font-bold text-[#8B4513]">R$ 4,50</span>
          <button class="py-3 bg-[#8B4513] text-white rounded-xl font-bold shadow-lg hover:bg-[#6e3710]">Adicionar ao Pedido</button>
        </div>
      </div>
    </div>
  </div>

  <header class="py-10 text-center">
    <h1 class="text-4xl font-bold text-[#8B4513]">OBA Doceria</h1>
    <p class="text-[#D8B36A] uppercase tracking-widest text-sm mt-2">O sabor artesanal</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-20">
    <div class="grid grid-cols-2 gap-4">
      
      <!-- Doce 1 -->
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-[#E8D5B5] flex flex-col items-center text-center">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (1).jpeg" alt="Brigadeiro" class="w-20 h-20 object-cover rounded-full mb-3 shadow-inner border-2 border-[#E8D5B5]">
        <h3 class="font-bold text-sm mb-1">Brigadeiro Tradicional</h3>
        <button onclick="openModal('WhatsApp Image 2026-06-08 at 11.30.06 (1).jpeg', 'Brigadeiro Tradicional', 'Massa cremosa preparada com 64% de cacau selecionado, leite condensado de alta qualidade e finalizado com granulado belga autêntico.')" class="text-[11px] text-[#8B4513] underline mt-auto mb-3">Ver detalhes</button>
        <button class="w-full py-2 bg-[#8B4513] text-white rounded-xl text-xs font-bold">+ Selecionar</button>
      </div>

      <!-- Doce 2 -->
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-[#E8D5B5] flex flex-col items-center text-center">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (2).jpeg" alt="Ninho" class="w-20 h-20 object-cover rounded-full mb-3 shadow-inner border-2 border-[#E8D5B5]">
        <h3 class="font-bold text-sm mb-1">Leite Ninho</h3>
        <button onclick="openModal('WhatsApp Image 2026-06-08 at 11.30.06 (2).jpeg', 'Leite Ninho', 'Uma massa leve feita com leite em pó premium, trazendo a textura aveludada e o sabor irresistível que derrete na boca.')" class="text-[11px] text-[#8B4513] underline mt-auto mb-3">Ver detalhes</button>
        <button class="w-full py-2 bg-[#8B4513] text-white rounded-xl text-xs font-bold">+ Selecionar</button>
      </div>

    </div>
  </main>

  <script>
    function openModal(src, title, desc) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
  </script>

</body>
</html>
