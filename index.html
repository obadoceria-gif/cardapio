<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F0] text-[#3B2A1E]">

  <!-- Modal de Detalhes -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white max-w-sm w-full rounded-2xl p-6 relative" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-2 right-2 text-gray-500 text-xl font-bold p-2">✕</button>
      <img id="modal-img" src="" alt="Zoom" class="w-full h-64 object-cover rounded-lg mb-4">
      <h2 id="modal-title" class="text-xl font-bold text-[#8B4513] mb-2"></h2>
      <p id="modal-desc" class="text-sm text-gray-600 mb-4"></p>
      <button class="w-full py-3 bg-[#8B4513] text-white rounded-lg font-bold">Adicionar ao Pedido</button>
    </div>
  </div>

  <header class="py-10 text-center">
    <h1 class="text-4xl font-bold text-[#8B4513]">OBA Doceria</h1>
    <p class="text-[#D8B36A] uppercase tracking-widest text-sm mt-2">O sabor artesanal</p>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-20">
    <div class="grid grid-cols-2 gap-4">
      
      <!-- Doce 1 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-[#E8D5B5] flex flex-col items-center text-center">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (1).jpeg" alt="Brigadeiro" class="w-24 h-24 object-contain rounded-full mb-3 shadow-inner">
        <h3 class="font-bold text-sm">Brigadeiro Tradicional</h3>
        <button onclick="openModal('WhatsApp Image 2026-06-08 at 11.30.06 (1).jpeg', 'Brigadeiro Tradicional', 'Massa cremosa com 64% de cacau e granulado belga.')" class="text-[10px] text-[#8B4513] underline mt-1 mb-2">Ver detalhes</button>
        <button class="w-full mt-auto py-2 bg-[#8B4513] text-white rounded-lg text-xs">+ Selecionar</button>
      </div>

      <!-- Doce 2 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-[#E8D5B5] flex flex-col items-center text-center">
        <img src="WhatsApp Image 2026-06-08 at 11.30.06 (2).jpeg" alt="Ninho" class="w-24 h-24 object-contain rounded-full mb-3 shadow-inner">
        <h3 class="font-bold text-sm">Leite Ninho</h3>
        <button onclick="openModal('WhatsApp Image 2026-06-08 at 11.30.06 (2).jpeg', 'Leite Ninho', 'Massa de leite em pó premium com recheio cremoso.')" class="text-[10px] text-[#8B4513] underline mt-1 mb-2">Ver detalhes</button>
        <button class="w-full mt-auto py-2 bg-[#8B4513] text-white rounded-lg text-xs">+ Selecionar</button>
      </div>

    </div>
  </main>

  <script>
    function openModal(src, title, desc) {
      document.getElementById('modal-img').src = src;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
  </script>

</body>
</html>
