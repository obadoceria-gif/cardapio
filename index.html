<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho com Segurança</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .cart {
      width: 350px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }
    .cart-header, .cart-footer {
      padding: 10px;
      background: #f5f5f5;
    }
    .cart-items {
      max-height: 200px; /* limita altura */
      overflow-y: auto;  /* ativa scroll interno */
      padding: 10px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background: #28a745;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #218838; }
    #order-summary {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      background: #fafafa;
    }
  </style>
</head>
<body>

<h2>Exemplo de Carrinho</h2>
<div class="cart">
  <div class="cart-header">
    <h3>Carrinho (<span id="cart-count">0</span> itens)</h3>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <p>Total: R$ <span id="cart-total">0,00</span></p>
    <button onclick="gerarResumo()">Finalizar Pedido</button>
  </div>
</div>

<div id="order-summary"></div>
<button onclick="gerarImagem()">Gerar Imagem Segura</button>

<!-- Biblioteca para gerar imagem -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let cart = [];
function addToCart(name, price) {
  cart.push({name, price});
  renderCart();
}
function renderCart() {
  const itemsDiv = document.querySelector('.cart-items');
  itemsDiv.innerHTML = '';
  let total = 0;
  cart.forEach(item => {
    total += item.price;
    itemsDiv.innerHTML += `<div class="cart-item">
      <span>${item.name}</span>
      <span>R$ ${item.price.toFixed(2)}</span>
    </div>`;
  });
  document.getElementById('cart-count').innerText = cart.length;
  document.getElementById('cart-total').innerText = total.toFixed(2);
}

// Gera resumo do pedido
function gerarResumo() {
  let resumoDiv = document.getElementById('order-summary');
  resumoDiv.innerHTML = "<h3>Pedido #" + Date.now() + "</h3>";
  let total = 0;
  cart.forEach(item => {
    resumoDiv.innerHTML += `<p>${item.name} - R$ ${item.price.toFixed(2)}</p>`;
    total += item.price;
  });
  resumoDiv.innerHTML += `<p><strong>Total: R$ ${total.toFixed(2)}</strong></p>`;
}

// Gera imagem segura do resumo
function gerarImagem() {
  html2canvas(document.querySelector("#order-summary")).then(canvas => {
    const imgData = canvas.toDataURL("image/png");
    // Mostra a imagem gerada na tela
    let img = document.createElement("img");
    img.src = imgData;
    img.style.maxWidth = "350px";
    document.body.appendChild(img);

    // Aqui você poderia enviar a imagem para o servidor
    // e gerar link para WhatsApp com a imagem anexada
    alert("Imagem do pedido gerada com segurança!");
  });
}

// Teste inicial com alguns produtos
addToCart("Tábua Doce Artesanal", 188);
addToCart("Caixa Presente Clássica", 75);
addToCart("Produto Extra", 120);
addToCart("Outro Produto", 60);
</script>

</body>
</html>
