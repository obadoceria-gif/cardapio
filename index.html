<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Presenteáveis | OBA Doceria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .cart-scroll::-webkit-scrollbar { width: 4px; }
    .cart-scroll::-webkit-scrollbar-thumb { background-color: #E8D5B5; border-radius: 10px; }
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; color: #3B2A1E; }
  </style>
</head>
<body class="antialiased pb-20">

  <div id="modal-caixa-completa" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4" onclick="fecharModalCompleta()">
    <div class="bg-white max-w-md w-full rounded-[2rem] p-6 relative shadow-2xl text-center space-y-4" onclick="event.stopPropagation()">
      <button onclick="fecharModalCompleta()" class="absolute top-4 right-4 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center text-gray-500 font-bold">✕</button>
      
      <div class="w-14 h-14 bg-green-50 text-green-600 rounded-full flex items-center justify-center text-2xl mx-auto"><i class="fa-solid fa-square-check"></i></div>
      
      <div>
        <h2 id="modal-titulo-dinamico" class="text-xl font-black text-[#8B4513] mt-2">Nome do Kit</h2>
        <p id="modal-desc-dinamica" class="text-[11px] text-gray-500 mt-2 px-2 leading-tight"></p>
      </div>
      
      <p class="text-sm text-gray-500 font-semibold mt-2 border-b border-gray-100 pb-3">Valor: <span id="modal-subtotal-pedido" class="font-black text-[#8B4513] text-xl">R$ 0,00</span></p>

      <div class="flex flex-col gap-2 pt-2">
        <button onclick="adicionarAoCarrinho('continuar')" class="w-full py-3.5 bg-green-600 text-white font-bold text-[10px] rounded-xl shadow-md uppercase tracking-widest active:scale-95">Adicionar e Continuar</button>
        <button onclick="adicionarAoCarrinho('finalizar')" class="w-full py-3.5 bg-[#8B4513] text-white font-bold text-[10px] rounded-xl shadow-sm uppercase tracking-widest active:scale-95">Finalizar Pedido Blindado</button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full mx-auto"></div>
  </main>

  <script>
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake de brigadeiro, uva verde e morangos.', precoFixo: 180.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_1.png' }
    ];

    let caixaAtiva = null;
    let carrinhoDeItens = [];
    const URL_WEB_APP = 'INSIRA_AQUI_A_SUA_URL_DO_GOOGLE_APPS_SCRIPT';

    function abrirModalKit(idKit) {
      const kit = kitsPresenteaveis.find(k => k.id === idKit);
      caixaAtiva = { ...kit };
      document.getElementById('modal-titulo-dinamico').innerText = kit.nome;
      document.getElementById('modal-desc-dinamica').innerText = kit.desc;
      document.getElementById('modal-subtotal-pedido').innerText = "R$ " + kit.precoFixo.toFixed(2).replace('.', ',');
      document.getElementById('modal-caixa-completa').classList.remove('hidden');
    }

    async function adicionarAoCarrinho(acao) {
      let codPedido = "OBA-" + Math.floor(1000 + Math.random() * 9000);
      let dadosPedido = {
        cod: codPedido,
        nome: "Cliente Teste", // Integrar com seu campo de nome depois
        total: caixaAtiva.precoFixo,
        detalhes: caixaAtiva.nome
      };

      // 1. Envia para o seu Google Sheets silenciosamente
      try {
        await fetch(URL_WEB_APP, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(dadosPedido)
        });
        console.log("Pedido registrado com segurança:", codPedido);
      } catch (err) { console.error("Erro ao registrar no cofre:", err); }

      // 2. Monta o WhatsApp com o Código Blindado
      let texto = `🛒 *PEDIDO OFICIAL OBA*\n*Cod:* #${codPedido}\n\n*Item:* ${caixaAtiva.nome}\n*Total:* R$ ${caixaAtiva.precoFixo.toFixed(2)}\n\n_🔒 Conferido pelo sistema._`;
      
      window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(texto)}`, '_blank');
      fecharModalCompleta();
    }

    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }
    function renderizarKits() {
      const grid = document.getElementById('kits-grid');
      kitsPresenteaveis.forEach(kit => {
        grid.innerHTML += `<div class="bg-white p-4 rounded-3xl border shadow-sm"><h3 class="font-bold">${kit.nome}</h3><button onclick="abrirModalKit('${kit.id}')" class="mt-4 w-full py-2 bg-[#8B4513] text-white rounded-lg text-xs font-bold uppercase">Configurar</button></div>`;
      });
    }
    renderizarKits();
  </script>
</body>
</html>
