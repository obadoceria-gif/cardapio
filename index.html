<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #FDFBF7; color: #5D3A1A; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- NAVEGAÇÃO -->
  <div id="app-container">
    <!-- TELA 1 -->
    <section id="pag-1" class="min-h-screen flex flex-col items-center justify-center p-6">
      <h1 class="text-2xl font-black mb-8">BEM-VINDO</h1>
      <button onclick="navegarPara('pag-2')" class="bg-[#8B4513] text-white px-10 py-4 rounded-2xl font-bold">DESCOBRIR NOSSA HISTÓRIA</button>
    </section>

    <!-- TELA 2 -->
    <section id="pag-2" class="hidden min-h-screen flex flex-col items-center justify-center p-6">
      <div class="bg-white p-8 rounded-3xl shadow-lg text-center max-w-xs">
        <h2 class="font-black text-xl mb-4">NOSSA ESSÊNCIA</h2>
        <p class="text-sm mb-6">Na OBA Doceria, cada brigadeiro é uma obra de arte.</p>
        <button onclick="navegarPara('pag-3')" class="w-full py-3 bg-[#8B4513] text-white rounded-xl font-bold text-xs">VER O CARDÁPIO</button>
      </div>
    </section>

    <!-- TELA 3 -->
    <section id="pag-3" class="hidden min-h-screen flex flex-col p-6 max-w-sm mx-auto justify-center">
      <h2 class="text-center font-black text-xl mb-8">ESCOLHA SUA EXPERIÊNCIA</h2>
      <!-- Aqui entrarão os botões originais -->
    </section>
  </div>

  <script>
    function navegarPara(id) {
        document.querySelectorAll('#app-container > section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
