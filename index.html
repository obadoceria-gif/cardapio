<script>
    const kitsPresenteaveis = [
      { id: 'kit_tabua', nome: 'Tábua Doce Artesanal', desc: 'Mini naked cake de brigadeiro, uva verde, morangos e doces variados em tábua redonda de MDF.', precoFixo: 180.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_1.png' },
      { id: 'kit_classico', nome: 'Caixa Presente Clássica', desc: '12 brigadeiros em caixa com laço.', precoFixo: 75.00, img: 'https://raw.githubusercontent.com/obadoceria-gif/cardapio/main/Images/Presenteaveis/Opcao_2.png' }
    ];

    let carrinhoDeItens = [];
    const URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbzzexSBR6WVLjcWH2Fp5TfKuZivAR-BoT4m3CufvgnBoz_ku45ITasE1SxnuJ3HQxFXpw/exec';

    // VALIDAÇÃO EM TEMPO REAL DO FORMULÁRIO
    document.querySelectorAll('#cli-nome, #cli-data, #cli-hora, #cli-pagamento').forEach(el => el.addEventListener('change', () => {
        const preenchido = ['cli-nome', 'cli-data', 'cli-hora', 'cli-pagamento'].every(id => document.getElementById(id).value !== "");
        const btn = document.getElementById('btn-finalizar');
        btn.disabled = !preenchido;
        btn.className = preenchido ? "w-full py-4 bg-green-600 text-white font-black rounded-xl uppercase tracking-widest shadow-lg transition-all" : "w-full py-4 bg-gray-300 text-white font-black rounded-xl uppercase tracking-widest opacity-50 cursor-not-allowed transition-all";
        btn.innerText = preenchido ? "Enviar Pedido Seguro" : "Preencha os dados acima";
    }));

    // FUNÇÃO BLINDADA: REGISTRO NO COFRE + WHATSAPP
    async function finalizarPedidoBlindado() {
        const nome = document.getElementById('cli-nome').value, data = document.getElementById('cli-data').value, hora = document.getElementById('cli-hora').value, pag = document.getElementById('cli-pagamento').value;
        let cod = "OBA-" + Math.floor(1000 + Math.random() * 9000);
        let total = carrinhoDeItens.reduce((a, b) => a + (b.precoCalculadoUnitario * b.quantidade), 0);
        let detalhes = JSON.stringify(carrinhoDeItens);

        try {
            await fetch(URL_WEB_APP, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ cod, nome, total, detalhes, entrega: `${data} ${hora}`, pag })
            });
        } catch(e) { console.error("Erro no Cofre", e); }

        let msg = `🛒 *PEDIDO OFICIAL OBA*\n*Cod:* #${cod}\n\n*Cliente:* ${nome}\n*Entrega:* ${data} às ${hora}\n*Pagamento:* ${pag}\n\n`;
        carrinhoDeItens.forEach(i => msg += `*${i.quantidade}x ${i.titulo}* (${i.detalhes}) - R$ ${(i.precoCalculadoUnitario * i.quantidade).toFixed(2)}\n`);
        msg += `\n*TOTAL:* R$ ${total.toFixed(2)}\n\n_🔒 Pedido blindado sob o código #${cod}_`;
        
        window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(msg)}`, '_blank');
        fecharModalCarrinho();
    }

    // FUNÇÕES DE VITRINE E CARRINHO (Base original aprovada)
    function renderizarKits() {
      const grid = document.getElementById('kits-grid');
      grid.innerHTML = kitsPresenteaveis.map(kit => `
        <div class="bg-white rounded-[1.5rem] shadow-sm border border-[#E8D5B5] flex flex-col overflow-hidden w-full transition-all hover:border-[#8B4513]">
          <div class="w-full h-56 sm:h-64 bg-gray-50 border-b border-[#E8D5B5] overflow-hidden">
            <img src="${kit.img}" class="h-full w-full object-cover" onerror="this.src='https://placehold.co/400x400?text=Oba+Kit'">
          </div>
          <div class="p-5 flex-1"><h3 class="font-black text-sm text-[#3B2A1E]">${kit.nome}</h3><p class="text-[10px] text-gray-500 my-2">${kit.desc}</p><p class="text-sm text-[#8B4513] font-black mb-4">R$ ${kit.precoFixo.toFixed(2).replace('.', ',')}</p><button onclick="abrirModalKit('${kit.id}')" class="w-full py-3 bg-[#8B4513] text-white rounded-xl text-[11px] font-bold uppercase tracking-wider">Configurar Presente</button></div>
        </div>
      `).join('');
    }

    function abrirModalKit(id) {
      window.kitAtivo = kitsPresenteaveis.find(k => k.id === id);
      document.getElementById('modal-titulo-dinamico').innerText = window.kitAtivo.nome;
      document.getElementById('modal-desc-dinamica').innerText = window.kitAtivo.desc;
      document.getElementById('modal-subtotal-pedido').innerText = "R$ " + window.kitAtivo.precoFixo.toFixed(2).replace('.', ',');
      document.getElementById('modal-caixa-completa').classList.remove('hidden');
    }

    function toggleOpcional(tipo) {
      let box = document.getElementById('chk-'+tipo); box.classList.toggle('bg-[#8B4513]'); box.querySelector('i').classList.toggle('opacity-0');
      let total = window.kitAtivo.precoFixo + (document.getElementById('chk-laco').classList.contains('bg-[#8B4513]') ? 4.50 : 0) + (document.getElementById('chk-placa').classList.contains('bg-[#8B4513]') ? 3.50 : 0);
      document.getElementById('modal-subtotal-pedido').innerText = "R$ " + total.toFixed(2).replace('.', ',');
    }

    function adicionarAoCarrinho(acao) {
      let total = window.kitAtivo.precoFixo + (document.getElementById('chk-laco').classList.contains('bg-[#8B4513]') ? 4.50 : 0) + (document.getElementById('chk-placa').classList.contains('bg-[#8B4513]') ? 3.50 : 0);
      let det = "Kit Fechado" + (document.getElementById('chk-laco').classList.contains('bg-[#8B4513]') ? " + Laço" : "") + (document.getElementById('chk-placa').classList.contains('bg-[#8B4513]') ? " + Placa" : "");
      carrinhoDeItens.push({ titulo: window.kitAtivo.nome, precoCalculadoUnitario: total, quantidade: 1, detalhes: det });
      renderizarConteudoModalCarrinho(); fecharModalCompleta();
      if(acao === 'carrinho') abrirModalCarrinho();
    }

    function abrirModalCarrinho() { renderizarConteudoModalCarrinho(); document.getElementById('modal-carrinho').classList.remove('hidden'); }
    function fecharModalCarrinho() { document.getElementById('modal-carrinho').classList.add('hidden'); }
    function fecharModalCompleta() { document.getElementById('modal-caixa-completa').classList.add('hidden'); }

    function renderizarConteudoModalCarrinho() {
      const container = document.getElementById('conteudo-modal-carrinho');
      container.innerHTML = carrinhoDeItens.map((i, idx) => `
        <div class="bg-gray-50 border p-4 rounded-2xl flex flex-col gap-2">
            <p class="font-black text-sm">${i.titulo}</p><p class="text-[9px] uppercase">${i.detalhes}</p>
            <div class="flex justify-between items-center pt-2 border-t"><p class="font-black text-sm">R$ ${(i.precoCalculadoUnitario * i.quantidade).toFixed(2)}</p></div>
        </div>
      `).join('');
      document.getElementById('modal-carrinho-total').innerText = "R$ " + carrinhoDeItens.reduce((a, b) => a + (b.precoCalculadoUnitario * b.quantidade), 0).toFixed(2);
    }

    renderizarKits();
  </script>
</body>
</html>
