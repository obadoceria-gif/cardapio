<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Experiência Gourmet Interativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
    body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; background-color: #FAF5F0; color: #3B2A1E; }
    .fade-page { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="antialiased">

  <div id="custom-toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-12 opacity-0 pointer-events-none bg-[#8B4513] text-white">
    <span id="toast-text" class="font-medium text-center w-full text-sm"></span>
  </div>

  <div id="modal-decorados" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white max-w-2xl w-full rounded-3xl p-6 md:p-10 relative shadow-2xl fade-page">
      <button onclick="document.getElementById('modal-decorados').classList.add('hidden')" class="absolute top-5 right-5 text-gray-400">✕</button>
      <div id="pers-view-info" class="space-y-6">
        <h2 class="text-xl font-semibold text-[#8B4513] text-center">Doces Personalizados & Decorados</h2>
        <button onclick="avancarFormularioPersonalizados()" class="w-full py-4 bg-[#8B4513] text-white rounded-2xl text-xs uppercase">Preencher Dados</button>
      </div>
      <div id="pers-view-inputs" class="space-y-4 hidden">
        <input type="text" id="pers-tema" placeholder="Tema?" class="w-full p-3.5 bg-gray-50 border rounded-xl">
        <input type="date" id="pers-data" class="w-full p-3.5 bg-gray-50 border rounded-xl">
        <button onclick="enviarOrcamentoEspecial('personalizados')" class="w-full py-4 bg-green-600 text-white rounded-xl text-xs uppercase">Enviar via WhatsApp</button>
      </div>
    </div>
  </div>

  <section id="pag-capa" class="min-h-screen flex flex-col items-center justify-center p-6 fade-page">
    <button onclick="navegarPara(3)" class="px-8 py-4 bg-[#8B4513] text-white rounded-2xl text-xs uppercase">Ver Cardápio</button>
  </section>

  <section id="pag-seletor" class="min-h-screen hidden flex flex-col items-center justify-center p-6 fade-page">
    <div class="grid gap-4 w-full max-w-sm">
      <button onclick="entFluxoCaixas()" class="p-6 bg-[#8B4513] text-white rounded-3xl">Montagem de Caixa</button>
      <button onclick="abrirBannerDegustacao()" class="p-6 border border-[#8B4513] text-[#8B4513] rounded-3xl">Caixa Degustação</button>
    </div>
  </section>

  <main id="fluxo-principal" class="hidden p-6 max-w-6xl mx-auto fade-page">
    <button onclick="navegarPara(3)" class="text-xs uppercase font-bold text-gray-400">← Voltar</button>
    <div id="opcoes-caixas" class="grid grid-cols-2 gap-4 mt-6">
      <button onclick="selecionarCaixa('25')" class="p-4 bg-white border rounded-2xl">Caixa 25</button>
      <button onclick="selecionarCaixa('35')" class="p-4 bg-white border rounded-2xl">Caixa 35</button>
    </div>
    <div id="cardapio-grid" class="grid grid-cols-2 gap-4 mt-8"></div>
  </main>

  <script>
    // --- LÓGICA INTEGRADA ---
    let caixaAtiva = null; let quantidades = {};
    const caixasConfigs = { '25': { id: '25', totalDoces: 25 }, '35': { id: '35', totalDoces: 35 }, 'degustacao': { id: 'degustacao', totalDoces: 25 } };

    function navegarPara(n) {
      document.getElementById('pag-capa').classList.add('hidden');
      document.getElementById('pag-seletor').classList.add('hidden');
      document.getElementById('fluxo-principal').classList.add('hidden');
      if(n === 1) document.getElementById('pag-capa').classList.remove('hidden');
      if(n === 3) document.getElementById('pag-seletor').classList.remove('hidden');
      if(n === 4) document.getElementById('fluxo-principal').classList.remove('hidden');
    }

    function entFluxoCaixas() { navegarPara(4); }

    function abrirBannerDegustacao() {
      navegarPara(4);
      alert("Abrindo configuração de degustação...");
    }

    function selecionarCaixa(id) {
      caixaAtiva = caixasConfigs[id];
      document.getElementById('opcoes-caixas').classList.add('hidden');
      alert("Caixa selecionada, agora escolha os sabores.");
    }
    
    function abrirModalEspecial(tipo) {
      if(tipo === 'personalizados') document.getElementById('modal-decorados').classList.remove('hidden');
    }
    
    function avancarFormularioPersonalizados() {
      document.getElementById('pers-view-info').classList.add('hidden');
      document.getElementById('pers-view-inputs').classList.remove('hidden');
    }
    
    function voltarLAteralPersonalizados() {
      document.getElementById('pers-view-inputs').classList.add('hidden');
      document.getElementById('pers-view-info').classList.remove('hidden');
    }

    function fecharModalPersonalizados() { document.getElementById('modal-decorados').classList.add('hidden'); }
    function fecharModalEventos() { document.getElementById('modal-eventos').classList.add('hidden'); }
    function enviarOrcamentoEspecial(tipo) { alert("Enviando orçamento de " + tipo); }
  </script>
</body>
</html>
