<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBA Doceria | Sistema Completo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .cart-scroll::-webkit-scrollbar { width: 4px; }
    .cart-scroll::-webkit-scrollbar-thumb { background-color: #E8D5B5; border-radius: 10px; }
    body { font-family: 'Poppins', sans-serif; background-color: #FAF5F0; }
  </style>
</head>
<body class="antialiased pb-20">

  <div id="modal-carrinho" class="fixed inset-0 bg-black/80 hidden z-[110] flex items-center justify-center p-4" onclick="fecharModalCarrinho()">
    <div class="bg-white w-full max-w-lg rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <h2 class="text-lg font-black text-[#8B4513] uppercase tracking-widest"><i class="fa-solid fa-basket-shopping"></i> Seu Carrinho</h2>
        <button onclick="fecharModalCarrinho()" class="text-gray-500 font-bold">✕</button>
      </div>
      <div id="conteudo-modal-carrinho" class="flex-1 overflow-y-auto cart-scroll space-y-3 pb-4"></div>
      <div class="border-t pt-4">
        <div class="flex justify-between items-center bg-[#FAF5F0] p-4 rounded-xl border mb-4">
          <span class="text-xs font-bold text-gray-400 uppercase">Total:</span>
          <span class="text-2xl font-black text-[#8B4513]" id="modal-carrinho-total">R$ 0,00</span>
        </div>
        <button onclick="finalizarPedidoUnificado()" class="w-full py-4 bg-[#8B4513] text-white font-bold text-xs uppercase tracking-widest shadow-lg">Finalizar Pedido Seguro <i class="fa-brands fa-whatsapp"></i></button>
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <section id="secao-kits" class="bg-white p-6 rounded-[2rem] border border-[#E8D5B5] shadow-sm mb-8">
      <h3 class="font-bold text-[#8B4513] uppercase mb-4 flex items-center gap-2">🎁 Vitrine de Presentes</h3>
      <div id="kits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
    </section>

    <section id="secao-doces" class="bg-white p-6 rounded-[2rem] border border-[#E8D5B5] shadow-sm">
      <h3 class="font-bold text-[#8B4513] uppercase mb-4">Doces Tradicionais</h3>
      <div id="cardapio-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>
  </main>

  <script>
    // ... [Mantenha aqui seu catálogo e configurações de caixas] ...
    
    // FUNÇÃO UNIFICADA DE ENVIO (Segurança Blindada)
    function finalizarPedidoUnificado() {
      let codPedido = "OBA-" + Math.floor(1000 + Math.random() * 9000); 
      let texto = `🛒 *PEDIDO OFICIAL OBA*\n*Cod:* #${codPedido}\n\n`;
      let totalGeral = 0;

      // Soma itens de presentes
      carrinhoDeItens.forEach(item => {
        totalGeral += (item.precoCalculadoUnitario * item.quantidade);
        texto += `*${item.quantidade}x ${item.titulo}* (${item.detalhes})\n`;
      });

      // Soma itens de caixas de doces
      // [Adicione aqui a lógica que percorre seu carrinho de doces]

      texto += `\n*VALOR TOTAL:* R$ ${totalGeral.toFixed(2).replace('.', ',')}\n\n`;
      texto += `_🔒 Pedido conferido por sistema._`;
      
      window.open(`https://api.whatsapp.com/send?phone=5555999117626&text=${encodeURIComponent(texto)}`, '_blank');
    }

    // [Adicione aqui as funções renderizarDoces, renderizarKits, alterarQtd, etc]
  </script>
</body>
</html>
